<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Microsearch 2.0</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;1,6..72,400;1,6..72,500&display=swap">
<style>
/* Microsearch 2.0: slide-glass white ground, indigo ink, one stain color per group.
   Layout: collapsible sidebar + one content column; binomials set large in italic serif. */
:root{
  --bg:#F3F6F7; --surface:#FFFFFF; --surface-2:#F7F9FA; --ink:#1C2033; --muted:#4A5163; --faint:#5F6677;
  --line:#D9E0E4; --line-2:#E6EBEE; --hover:#EEF2F4; --focus:#4A30B8; --scrim:rgba(28,32,51,.4);
  --shadow:0 18px 40px -18px rgba(28,32,51,.35);
  --font-ui:'Anuphan',system-ui,'Noto Sans Thai',sans-serif;
  --font-sci:'Newsreader',Georgia,'Times New Roman',serif;
  --bac-dot:#5B3FD0; --bac-tint:#EFEBFC; --bac-ring:#CDC2F5; --bac-ink:#4A30B8; --bac-fill:#DCD3FA;
  --arc-dot:#E39A1B; --arc-tint:#FDF2DF; --arc-ring:#F2D29A; --arc-ink:#8A5200; --arc-fill:#FBE3B8;
  --fun-dot:#11807B; --fun-tint:#E1F2F0; --fun-ring:#ADD9D4; --fun-ink:#0B5F5B; --fun-fill:#C6E8E4;
  --pro-dot:#2F8A3F; --pro-tint:#E4F3E6; --pro-ring:#B6DDBC; --pro-ink:#236B30; --pro-fill:#CBE9D0;
  --pla-dot:#8FA61C; --pla-tint:#F2F6DD; --pla-ring:#D6E29E; --pla-ink:#566B08; --pla-fill:#E3ECB6;
  --ani-dot:#C23B5C; --ani-tint:#FBEAEF; --ani-ring:#F0C0CC; --ani-ink:#A1203F; --ani-fill:#F6D3DC;
  --g-dot:var(--ink); --g-tint:var(--hover); --g-ring:var(--line); --g-ink:var(--ink); --g-fill:var(--line);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#151A26; --surface:#1C2230; --surface-2:#222939; --ink:#E8EBF2; --muted:#B6BCCA; --faint:#9CA3B3;
    --line:#323B4D; --line-2:#2A3242; --hover:#262E3F; --focus:#A99BFF; --scrim:rgba(5,8,15,.6);
    --shadow:0 18px 40px -18px rgba(0,0,0,.7);
    --bac-dot:#8B72F0; --bac-tint:#262044; --bac-ring:#4A3D86; --bac-ink:#C9BDFF; --bac-fill:#3A2F70;
    --arc-dot:#F0A83A; --arc-tint:#33260F; --arc-ring:#6A4C1B; --arc-ink:#F5C46E; --arc-fill:#5A3F12;
    --fun-dot:#2BB3AB; --fun-tint:#12302E; --fun-ring:#22605B; --fun-ink:#7FD6CF; --fun-fill:#1B4E4A;
    --pro-dot:#4FB866; --pro-tint:#16301B; --pro-ring:#2C6236; --pro-ink:#8FD69A; --pro-fill:#24502C;
    --pla-dot:#A9C43C; --pla-tint:#262E10; --pla-ring:#4D5E1A; --pla-ink:#C8DE6E; --pla-fill:#3E4A15;
    --ani-dot:#E2627F; --ani-tint:#3A1A22; --ani-ring:#6E2D3D; --ani-ink:#F29AAE; --ani-fill:#5A2533;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#151A26; --surface:#1C2230; --surface-2:#222939; --ink:#E8EBF2; --muted:#B6BCCA; --faint:#9CA3B3;
  --line:#323B4D; --line-2:#2A3242; --hover:#262E3F; --focus:#A99BFF; --scrim:rgba(5,8,15,.6);
  --shadow:0 18px 40px -18px rgba(0,0,0,.7);
  --bac-dot:#8B72F0; --bac-tint:#262044; --bac-ring:#4A3D86; --bac-ink:#C9BDFF; --bac-fill:#3A2F70;
  --arc-dot:#F0A83A; --arc-tint:#33260F; --arc-ring:#6A4C1B; --arc-ink:#F5C46E; --arc-fill:#5A3F12;
  --fun-dot:#2BB3AB; --fun-tint:#12302E; --fun-ring:#22605B; --fun-ink:#7FD6CF; --fun-fill:#1B4E4A;
  --pro-dot:#4FB866; --pro-tint:#16301B; --pro-ring:#2C6236; --pro-ink:#8FD69A; --pro-fill:#24502C;
  --pla-dot:#A9C43C; --pla-tint:#262E10; --pla-ring:#4D5E1A; --pla-ink:#C8DE6E; --pla-fill:#3E4A15;
  --ani-dot:#E2627F; --ani-tint:#3A1A22; --ani-ring:#6E2D3D; --ani-ink:#F29AAE; --ani-fill:#5A2533;
  color-scheme:dark;
}
[data-g="bacteria"]{--g-dot:var(--bac-dot);--g-tint:var(--bac-tint);--g-ring:var(--bac-ring);--g-ink:var(--bac-ink);--g-fill:var(--bac-fill)}
[data-g="archaea"]{--g-dot:var(--arc-dot);--g-tint:var(--arc-tint);--g-ring:var(--arc-ring);--g-ink:var(--arc-ink);--g-fill:var(--arc-fill)}
[data-g="fungi"]{--g-dot:var(--fun-dot);--g-tint:var(--fun-tint);--g-ring:var(--fun-ring);--g-ink:var(--fun-ink);--g-fill:var(--fun-fill)}
[data-g="protists"]{--g-dot:var(--pro-dot);--g-tint:var(--pro-tint);--g-ring:var(--pro-ring);--g-ink:var(--pro-ink);--g-fill:var(--pro-fill)}
[data-g="plants"]{--g-dot:var(--pla-dot);--g-tint:var(--pla-tint);--g-ring:var(--pla-ring);--g-ink:var(--pla-ink);--g-fill:var(--pla-fill)}
[data-g="animals"]{--g-dot:var(--ani-dot);--g-tint:var(--ani-tint);--g-ring:var(--ani-ring);--g-ink:var(--ani-ink);--g-fill:var(--ani-fill)}

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-ui);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--g-ink)}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
h1,h2,h3{text-wrap:balance}
.sci{font-family:var(--font-sci);font-style:italic;font-weight:400}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.dot{flex:none;width:12px;height:12px;border-radius:50%;background:var(--g-dot)}

/* ---------- shell ---------- */
.app{display:flex;min-height:100vh}
.side{position:sticky;top:0;height:100vh;overflow-y:auto;flex:none;width:268px;background:var(--surface);border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:22px;transition:width .2s ease;z-index:40}
.side-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.brand{display:flex;align-items:center;gap:10px;min-height:44px;text-decoration:none;color:var(--ink)}
.brand-name{display:flex;flex-direction:column;line-height:1.15}
.brand-name b{font-size:18px;font-weight:600;white-space:nowrap}
.brand-name span{font-size:13px;color:var(--faint)}
.icon-btn{width:44px;height:44px;border:0;background:none;border-radius:10px;display:grid;place-items:center;color:var(--muted);flex:none}
.icon-btn:hover{background:var(--hover)}
.nav-label{margin:0 0 6px 12px;font-size:13px;color:var(--faint)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:12px;min-height:44px;padding:10px 12px;border-radius:10px;text-decoration:none;color:var(--muted);font-size:15px}
.nav a:hover{background:var(--hover)}
.nav a[aria-current="page"]{background:var(--g-tint);color:var(--ink);font-weight:600}
.nav a .dot{margin:0 4px}
.seg{display:flex;padding:4px;background:var(--hover);border-radius:12px}
.seg button{flex:1;min-height:40px;border:0;border-radius:9px;background:transparent;color:var(--muted);font-size:14px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(28,32,51,.15)}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:10px}
.app.collapsed .side{width:76px}
.app.collapsed .side .lbl,.app.collapsed .side .nav-label,.app.collapsed .side .side-search,.app.collapsed .side .side-foot{display:none}
.app.collapsed .side-head{flex-direction:column}
.app.collapsed .nav a{justify-content:center}
.topbar{display:none}
.close-btn{display:none}
.scrim{display:none}

.search{position:relative}
.search svg.lead{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--faint);pointer-events:none}
.search input{width:100%;height:44px;border:1px solid var(--line);border-radius:10px;padding:0 12px 0 38px;background:var(--surface-2);font-size:15px}
.search input::placeholder{color:var(--faint)}
.search.big input{height:54px;border-radius:14px;padding-left:48px;font-size:16px;background:var(--surface);border-color:#C8D1D6}
:root[data-theme="dark"] .search.big input{border-color:var(--line)}
.search.big svg.lead{left:16px}
.results{position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:60;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:6px;box-shadow:var(--shadow);max-height:360px;overflow-y:auto}
.results[hidden]{display:none}
.results a{display:flex;align-items:center;gap:12px;min-height:44px;padding:8px 12px;border-radius:10px;text-decoration:none;color:var(--ink)}
.results a:hover,.results a.active{background:var(--hover)}
.results .r-sci{font-size:17px}
.results .r-th{font-size:14px;color:var(--muted)}
.results .r-g{margin-left:auto;font-size:13px;color:var(--faint);white-space:nowrap}
.results p{margin:0;padding:12px;font-size:15px;color:var(--muted)}

.main{flex:1;min-width:0;padding:44px clamp(16px,4vw,56px) 72px}
.wrap{max-width:1160px;margin:0 auto;display:flex;flex-direction:column;gap:40px}
.view{animation:enter .22s ease both}
@keyframes enter{from{opacity:.001;transform:translateY(6px)}to{opacity:1;transform:none}}
.notice{padding:12px 16px;border-radius:12px;background:var(--surface);border:1px dashed var(--line);font-size:14.5px;color:var(--muted)}

/* ---------- home ---------- */
.hero{display:flex;flex-direction:column;gap:18px;max-width:780px}
.hero h1{margin:0;font-size:clamp(32px,4.2vw,50px);line-height:1.15;font-weight:600;letter-spacing:-.01em}
.lede{margin:0;font-size:18px;line-height:1.75;color:var(--muted);max-width:62ch}
.hero .search{max-width:600px}
.tree{display:flex;flex-wrap:wrap;gap:1px;background:var(--line-2);border:1px solid var(--line);border-radius:20px;overflow:hidden}
.col{flex:1 1 210px;min-width:0;background:var(--surface);padding:18px 12px;display:flex;flex-direction:column;gap:2px}
.col-h{margin:0 0 4px 12px;font-size:13px;color:var(--faint)}
.dom{margin:14px 0 4px 12px;font-size:13px;color:var(--faint)}
.dom:first-of-type{margin-top:0}
.pick{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;padding:9px 12px;border:1px solid transparent;border-radius:10px;background:none;text-align:left;font-size:15.5px;transition:background-color .15s ease,border-color .15s ease}
.pick:hover{background:var(--surface-2)}
.pick[aria-pressed="true"]{background:var(--g-tint);border-color:var(--g-ring)}
.pick .two{display:flex;flex-direction:column;gap:1px;min-width:0}
.pick .sub{font-size:13px;color:var(--faint)}
.pick .end{margin-left:auto;font-size:13px;color:var(--faint)}
.pick .en{margin-left:auto;font-size:15px;color:var(--faint)}
.pick .sci{font-size:17px}
.pv{flex:2 1 340px;min-width:0;background:var(--g-tint);padding:28px 30px;display:flex;flex-direction:column;gap:12px}
.pv-path{margin:0;font-size:14px;color:var(--muted)}
.pv h3{margin:0;font-size:clamp(30px,3vw,42px);line-height:1.08;letter-spacing:-.01em}
.pv .th{margin:0;font-size:17px;font-weight:500}
.pv .note{margin:0;font-size:16px;line-height:1.75;max-width:46ch}
.pv-art{height:120px;display:flex;align-items:center}
.pv-art svg{height:100%;width:auto}
.tags{display:flex;flex-wrap:wrap;gap:8px}
.tag{display:inline-flex;align-items:center;min-height:30px;padding:0 12px;border-radius:999px;background:var(--surface);border:1px solid var(--g-ring);color:var(--g-ink);font-size:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 20px;border-radius:12px;background:var(--ink);color:var(--bg);text-decoration:none;font-weight:500;border:0}
.btn:hover{opacity:.9;color:var(--bg)}
.btn.quiet{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.pv .btn{align-self:flex-start;margin-top:6px}

.h2{margin:0;font-size:26px;font-weight:600;line-height:1.3}
.section{display:flex;flex-direction:column;gap:16px}
.groups4{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.gcard{display:flex;flex-direction:column;gap:6px;padding:20px;border-radius:16px;background:var(--surface);border:1px solid var(--line);text-decoration:none;color:var(--ink);border-top:4px solid var(--g-dot)}
.gcard:hover{background:var(--surface-2)}
.gcard b{font-size:19px;font-weight:600}
.gcard .sci{font-size:16px;color:var(--g-ink)}
.gcard p{margin:4px 0 0;font-size:14.5px;line-height:1.65;color:var(--muted)}
.gcard .count{margin-top:auto;padding-top:8px;font-size:13.5px;color:var(--faint)}
.tablebox{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:16px}
table{width:100%;min-width:1080px;border-collapse:collapse;font-size:15px;line-height:1.65}
th,td{padding:14px 18px;border-top:1px solid var(--line-2);text-align:left;vertical-align:top}
thead th{border-top:0;font-weight:600}
tbody th{font-weight:500;color:var(--muted);width:13%}
.thg{display:inline-flex;align-items:center;gap:8px}

.dg-chip{display:inline-flex;align-items:center;gap:8px}
.dg-chip[aria-pressed="true"]{background:var(--g-tint);border-color:var(--g-ring);color:var(--g-ink);font-weight:600}
.dg-scroll{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:22px 24px 26px}
.dg{position:relative}
.dg svg{position:absolute;left:0;top:0;overflow:visible}
.dg path{fill:none;stroke:var(--g-ring);stroke-width:1.6;transition:stroke .15s ease}
.dg path.hl{stroke:var(--g-dot);stroke-width:2.6}
.dg-rank{position:absolute;top:0;font-size:13px;color:var(--faint)}
.dg-node{position:absolute;display:block;width:174px;height:34px;line-height:32px;padding:0 11px;border-radius:9px;background:var(--surface-2);border:1px solid var(--line);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink);text-decoration:none;transition:border-color .15s ease,box-shadow .15s ease}
.dg-node.root{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:600}
.dg-node.unplaced{border-style:dashed;color:var(--faint)}
.dg-node.leaf{background:var(--g-tint);border-color:var(--g-ring);color:var(--g-ink);font-size:15.5px}
.dg-node.leaf:hover{color:var(--ink)}
.dg-node.hl{border-color:var(--g-dot);box-shadow:0 0 0 1px var(--g-dot)}
.dg-node.root.hl{box-shadow:0 0 0 2px var(--g-dot)}
button.dg-node{text-align:left;cursor:pointer;font-family:inherit}
button.dg-node.sci{font-family:var(--font-sci)}
button.dg-node:hover{border-color:var(--g-dot)}
.dg-node.sel{background:var(--g-dot);border-color:var(--g-dot);color:#fff;box-shadow:0 0 0 3px var(--g-tint)}
.dg-node.root.sel{background:var(--g-dot)}
.dg-node.on{border-color:var(--g-dot);box-shadow:0 0 0 1px var(--g-dot)}
.dg-node.in{background:var(--g-tint);border-color:var(--g-ring)}
.dg-node.dim{opacity:.45}
.dg path.on,.dg path.in{stroke:var(--g-dot);stroke-width:2.2}
.dg path.dim{opacity:.35}
.dg-panel{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:22px 24px;display:flex;flex-direction:column;gap:16px}
.dg-empty{margin:0;font-size:15.5px;color:var(--muted)}
.dg-panel-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.dg-panel-head h3{margin:2px 0 0;font-size:26px;line-height:1.25;font-weight:600}
.dg-panel-head h3.sci{font-weight:400;font-size:30px}
.dg-th{font-size:17px;font-weight:500;color:var(--muted);font-family:var(--font-ui);font-style:normal}
.dg-rk,.dg-count{margin:0;font-size:14px;color:var(--faint)}
.dg-list{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.dg-list a{display:flex;gap:14px;align-items:center;height:100%;padding:12px 14px;border-radius:14px;background:var(--surface-2);border:1px solid var(--line-2);text-decoration:none;color:var(--ink)}
.dg-list a:hover{border-color:var(--g-ring)}
.dg-list .sci{font-size:18px}
.dg-list .th{font-size:14px;color:var(--muted)}
.dg-below{font-size:12.5px;color:var(--faint)}
.dg-node.two{height:48px;line-height:1.25;padding-top:6px}
.dg-node .dg-l,.dg-node .dg-r{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dg-node .dg-r{font-family:var(--font-ui);font-style:normal;font-size:11.5px;color:var(--faint);margin-top:2px}
.dg-node.root .dg-r,.dg-node.sel .dg-r{color:inherit;opacity:.85}
.dg-node.leaf .dg-r{color:var(--g-ink);opacity:.85}
.dg-node.leaf.two .dg-l{font-size:15px}
.dg-read{margin:2px 0 0;font-size:15px;color:var(--muted)}
.pv-common{margin:0;font-size:14.5px;color:var(--muted)}
.ladder .rd{font-size:12.5px;color:var(--faint)}
.sp-rd-l{font-size:14px;font-weight:400;color:var(--faint);margin-right:4px}
.sp-common{margin:0;font-size:17px;color:var(--muted)}
.lv{display:inline-flex;align-items:center;min-height:24px;padding:0 9px;border-radius:6px;font-family:var(--font-ui);font-style:normal;font-size:12.5px;font-weight:600;white-space:nowrap;vertical-align:middle;line-height:1}
.lv-hs{background:#E2ECFA;color:#1D4E89}
.lv-uni{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
:root[data-theme="dark"] .lv-hs{background:#1E3350;color:#A9C8F0}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .lv-hs{background:#1E3350;color:#A9C8F0}}
.lv.big{min-height:32px;padding:0 12px;font-size:14px;border-radius:999px}
.dg-list .sci .lv{margin-left:6px}
.ladder button.step{font:inherit;color:inherit;text-align:left;cursor:pointer}
.ladder button.step:hover{border-color:var(--g-ring);background:var(--g-tint)}
.dg-info{display:flex;flex-direction:column;gap:8px;max-width:72ch}
.dg-info h4,.dg-sibs h4,.dg-list-h{margin:4px 0 0;font-size:15px;font-weight:600;color:var(--ink)}
.dg-desc{margin:0;font-size:16.5px;line-height:1.8}
.dg-path{margin:0;font-size:14px;color:var(--faint)}
.dg-crumb{border:0;background:none;padding:2px 2px;font:inherit;font-size:14px;color:var(--muted);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.dg-crumb:hover{color:var(--ink)}
.dg-sibs{display:flex;flex-direction:column;gap:10px}
.dg-sibs ul{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.dg-sibs button{display:flex;flex-direction:column;gap:6px;width:100%;height:100%;text-align:left;padding:14px 16px;border-radius:14px;border:1px solid var(--line-2);background:var(--surface-2);font:inherit;color:var(--ink);cursor:pointer}
.dg-sibs button:hover{border-color:var(--g-ring)}
.dg-sib-h{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px}
.dg-sib-r{font-size:13px;color:var(--faint)}
.dg-sib-n{margin-left:auto;font-size:13px;color:var(--faint)}
.dg-sib-d{font-size:14.5px;line-height:1.7;color:var(--muted)}
.dg-note{margin:0;font-size:13.5px;color:var(--faint)}
.dg-hint{display:none;margin:0;font-size:13.5px;color:var(--faint)}
@media (max-width:1300px){.dg-hint{display:block}}

/* ---------- group ---------- */
.crumbs{font-size:14px;color:var(--faint)}
.crumbs a{color:var(--muted)}
.ghead{display:flex;flex-direction:column;gap:14px}
.gtitle{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 18px}
.gtitle h1{margin:0;font-size:clamp(34px,4vw,50px);line-height:1.15;font-weight:600;letter-spacing:-.01em}
.gtitle .sci{font-size:clamp(24px,2.6vw,32px);color:var(--g-ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--muted);font-size:14px;transition:background-color .15s ease}
.chip:hover{background:var(--surface-2)}
.chip[aria-pressed="true"]{background:var(--g-ink);border-color:var(--g-ink);color:var(--surface)}
.split{display:flex;flex-wrap:wrap;gap:28px;align-items:flex-start}
.filters{flex:1 1 250px;max-width:300px;display:flex;flex-direction:column;gap:22px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px}
.filters fieldset{margin:0;padding:0;border:0;display:flex;flex-direction:column}
.filters legend{padding:0;margin-bottom:8px;font-size:14px;font-weight:600}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opt{min-height:36px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--muted);font-size:14px}
.opt:hover{background:var(--surface-2)}
.opt[aria-pressed="true"]{background:var(--g-tint);border-color:var(--g-ring);color:var(--g-ink);font-weight:600}
.list-area{flex:999 1 480px;min-width:0;display:flex;flex-direction:column;gap:12px}
.list-head{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px}
.list-head h2{margin:0;font-size:17px;font-weight:500;color:var(--muted)}
.rows{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.rows li+li{border-top:1px solid var(--line-2)}
.rowbtn{display:flex;width:100%;align-items:center;gap:16px;padding:12px 18px;min-height:76px;border:0;background:none;text-align:left}
.rowbtn:hover{background:var(--surface-2)}
.thumb{flex:none;width:56px;height:48px;border-radius:12px;background:var(--g-tint);display:grid;place-items:center;overflow:hidden}
.thumb svg{width:50px;height:auto}
.rowtxt{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
.rowtxt .sci{font-size:20px;line-height:1.25}
.rowtxt .th{font-size:14.5px;color:var(--muted)}
.meta{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:6px;max-width:44%}
.mini{display:inline-flex;align-items:center;min-height:28px;padding:0 10px;border-radius:8px;background:var(--surface-2);border:1px solid var(--line-2);font-size:13px;color:var(--muted);white-space:nowrap}
.chev{flex:none;color:var(--faint);transition:transform .2s ease}
.rowbtn[aria-expanded="true"] .chev{transform:rotate(180deg)}
.rowmore{padding:0 18px 18px 90px;display:flex;flex-direction:column;gap:12px}
.rowmore p{margin:0;font-size:15.5px;line-height:1.75;max-width:62ch}
.facts-inline{display:flex;flex-wrap:wrap;gap:4px 20px;font-size:14px;color:var(--muted)}
.empty{padding:32px;background:var(--surface);border:1px dashed var(--line);border-radius:16px;display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.empty p{margin:0;font-size:16px}

/* ---------- species ---------- */
.ladder{overflow-x:auto;padding-bottom:4px}
.ladder ol{list-style:none;margin:0;padding:0;display:flex;align-items:center;min-width:max-content}
.ladder li{display:flex;align-items:center}
.ladder .step{display:flex;flex-direction:column;gap:2px;padding:6px 12px;border-radius:10px;background:var(--surface);border:1px solid var(--line-2);text-decoration:none;color:var(--ink)}
.ladder a.step:hover{border-color:var(--g-ring)}
.ladder .rank{font-size:12.5px;color:var(--faint)}
.ladder .nm{font-size:16px;font-weight:500}
.ladder .nm.sci{font-size:17px;font-weight:400}
.ladder svg{margin:0 6px;color:var(--faint);flex:none}
.sp-title{display:flex;flex-direction:column;gap:10px}
.sp-title h1{margin:0;font-size:clamp(42px,6.4vw,88px);line-height:1.02;letter-spacing:-.02em}
.sp-sub{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px}
.sp-sub .th{margin:0;font-size:22px;font-weight:500}
.badge{display:inline-flex;align-items:center;gap:8px;min-height:32px;padding:0 12px;border-radius:999px;font-size:14px}
.badge.grp{background:var(--g-tint);color:var(--g-ink);font-weight:500;text-decoration:none}
.badge.draft{border:1px dashed var(--line);color:var(--muted)}
.sp-body{display:flex;flex-wrap:wrap;gap:32px;align-items:flex-start}
figure.art{flex:1 1 320px;max-width:460px;margin:0;display:flex;flex-direction:column;gap:10px}
.art-box{aspect-ratio:4/3;border-radius:20px;background:var(--g-tint);display:grid;place-items:center;overflow:hidden}
.art-box svg{width:76%;height:auto}
figcaption{font-size:14px;line-height:1.6;color:var(--muted)}
.sp-text{flex:999 1 420px;min-width:0;display:flex;flex-direction:column;gap:22px}
.sp-lede{margin:0;font-size:19px;line-height:1.8;max-width:58ch}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{flex:none;min-height:46px;padding:0 16px;border:0;border-bottom:2px solid transparent;margin-bottom:-1px;background:none;font-size:15.5px;color:var(--muted);border-radius:8px 8px 0 0}
.tab:hover{background:var(--surface-2)}
.tab[aria-selected="true"]{border-bottom-color:var(--g-dot);color:var(--ink);font-weight:600}
dl.facts{margin:0;display:flex;flex-direction:column}
dl.facts>div{display:flex;flex-wrap:wrap;gap:4px 24px;padding:14px 0;border-bottom:1px solid var(--line-2)}
dl.facts dt{flex:0 0 190px;font-size:15px;color:var(--muted)}
dl.facts dd{flex:1 1 260px;margin:0;font-size:16px;line-height:1.7}
.aside{display:flex;flex-wrap:wrap;gap:20px 40px;padding:28px 32px;border-radius:20px;background:var(--surface);border:1px solid var(--line)}
.aside h2{flex:1 1 220px;margin:0;font-size:22px;line-height:1.4;font-weight:600}
.aside ul{flex:3 1 420px;margin:0;padding-left:20px;display:flex;flex-direction:column;gap:10px;font-size:16px;line-height:1.7}
.near{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.near a{display:flex;gap:14px;align-items:center;padding:14px 16px;border-radius:14px;background:var(--surface);border:1px solid var(--line-2);text-decoration:none;color:var(--ink)}
.near a:hover{border-color:var(--g-ring)}
.near .sci{font-size:18px}
.near .th{font-size:14px;color:var(--muted)}
.pager{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px}
.pager a{display:flex;flex-direction:column;gap:2px;min-width:220px;padding:14px 18px;border-radius:14px;background:var(--surface);border:1px solid var(--line-2);text-decoration:none;color:var(--ink)}
.pager a:last-child{text-align:right;margin-left:auto}
.pager small{font-size:13px;color:var(--faint)}
.pager .sci{font-size:18px}
.foot{display:flex;flex-direction:column;gap:6px;padding-top:20px;border-top:1px solid var(--line);font-size:14px;line-height:1.7;color:var(--muted)}
.foot p{margin:0}

/* ---------- sources ---------- */
.prose{max-width:68ch;display:flex;flex-direction:column;gap:14px;font-size:16.5px;line-height:1.8}
.prose p{margin:0}
.prose h2{margin:12px 0 0;font-size:22px;font-weight:600}
.prose ul{margin:0;padding-left:22px}

/* ---------- illustrations ---------- */
.illo .b{fill:var(--g-fill);stroke:var(--g-ink);stroke-width:2.2;stroke-linejoin:round}
.illo .l{fill:none;stroke:var(--g-ink);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.illo .t{fill:none;stroke:var(--g-ink);stroke-width:1.4;stroke-linecap:round}
.illo .f{fill:var(--g-ink)}
.illo .acc{fill:#D9707A}
.illo .chl{fill:#55A85F}
.illo .chlx{fill:none;stroke-width:2.6}

/* ---------- small screens ---------- */
@media (max-width:899px){
  .app{display:block}
  .topbar{display:flex;position:sticky;top:0;z-index:30;height:60px;align-items:center;gap:6px;padding:0 8px;background:var(--surface);border-bottom:1px solid var(--line)}
  .topbar .brand{min-height:44px}
  .topbar .brand-name b{font-size:17px}
  .topbar .brand-name span{display:none}
  .topbar .push{margin-left:auto}
  .side{position:fixed;left:0;top:0;bottom:0;height:auto;width:min(310px,86vw);transform:translateX(-105%);visibility:hidden;transition:transform .24s ease,visibility .24s;box-shadow:8px 0 30px -12px rgba(0,0,0,.35)}
  .app.menu-open .side{transform:none;visibility:visible}
  .scrim{display:block;position:fixed;inset:0;background:var(--scrim);z-index:35;opacity:0;pointer-events:none;transition:opacity .2s ease}
  .app.menu-open .scrim{opacity:1;pointer-events:auto}
  .collapse-btn{display:none}
  .side .close-btn{display:grid}
  .app.collapsed .side{width:min(310px,86vw)}
  .app.collapsed .side .lbl,.app.collapsed .side .nav-label,.app.collapsed .side .side-search{display:revert}
  .app.collapsed .side .side-foot{display:flex}
  .app.collapsed .side-head{flex-direction:row}
  .app.collapsed .nav a{justify-content:flex-start}
  .main{padding-top:24px}
  .rowmore{padding-left:18px}
  .meta{display:none}
  .filters{max-width:none}
  .pv{padding:22px}
}
@media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important}}
</style>
</head>
<body>
<div class="app" id="app">

<header class="topbar">
  <button type="button" class="icon-btn" id="menuBtn" aria-controls="side" aria-expanded="false" data-i18n-aria="openMenu" aria-label="เปิดเมนู">
    <svg width="22" height="22" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="M4 7h14M4 11h14M4 15h9"/></svg>

      <svg width="32" height="32" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="14" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="11" cy="12" r="3" fill="var(--bac-dot)"/><circle cx="20.5" cy="11" r="2.4" fill="var(--arc-dot)"/><circle cx="12.5" cy="21" r="2.6" fill="var(--fun-dot)"/><circle cx="21" cy="20" r="3.2" fill="var(--pro-dot)"/><circle cx="16" cy="6.5" r="1.9" fill="var(--pla-dot)"/><circle cx="16" cy="26" r="1.9" fill="var(--ani-dot)"/></svg>

<script>
(function () {
'use strict';

/* ================= data ================= */
var GROUPS = [
  { id: 'bacteria', th: 'แบคทีเรีย', en: 'Bacteria', domain: 'Bacteria', domainTh: 'โดเมนแบคทีเรีย', domainEn: 'Domain Bacteria', rankTh: 'ไฟลัม', rankEn: 'Phylum',
    introTh: 'โพรแคริโอตที่พบได้แทบทุกที่บนโลก ตั้งแต่ดิน น้ำ ไปจนถึงลำไส้ของเรา ส่วนใหญ่ไม่ก่อโรค และหลายชนิดจำเป็นต่อวัฏจักรธาตุอาหาร ผนังเซลล์มีเพปทิโดไกลแคน ซึ่งเป็นจุดที่ยาปฏิชีวนะหลายชนิดออกฤทธิ์',
    introEn: 'Prokaryotes found almost everywhere, from soil and water to our own gut. Most are harmless and many drive nutrient cycles. Their cell walls contain peptidoglycan, the target of many antibiotics.',
    phyla: [['Proteobacteria', 'Pseudomonadota'], ['Firmicutes', 'Bacillota'], ['Cyanobacteria', 'Cyanobacteriota'], ['Actinobacteria', 'Actinomycetota'], ['Spirochaetes', 'Spirochaetota'], ['Deinococcus-Thermus', 'Deinococcota']] },
  { id: 'archaea', th: 'อาร์เคีย', en: 'Archaea', domain: 'Archaea', domainTh: 'โดเมนอาร์เคีย', domainEn: 'Domain Archaea', rankTh: 'ไฟลัม', rankEn: 'Phylum',
    introTh: 'โพรแคริโอตที่หน้าตาคล้ายแบคทีเรีย แต่พันธุกรรมและเคมีของเซลล์ใกล้ยูแคริโอตมากกว่า หลายชนิดอยู่ในที่ร้อนจัด เค็มจัด หรือไม่มีออกซิเจน และอีกมากอยู่ในทะเลและดินทั่วไป',
    introEn: 'Prokaryotes that look like bacteria but whose genetics and cell chemistry sit closer to eukaryotes. Many live in hot, salty or oxygen-free places, and many more in ordinary seas and soils.',
    phyla: [['Euryarchaeota', ''], ['Crenarchaeota', 'Thermoproteota'], ['Thaumarchaeota', 'Nitrososphaerota']] },
  { id: 'fungi', th: 'ฟังไจ', en: 'Fungi', domain: 'Eukarya', domainTh: 'โดเมนยูคาเรีย', domainEn: 'Domain Eukarya', rankTh: 'ไฟลัม', rankEn: 'Phylum',
    introTh: 'ยูแคริโอตที่ผนังเซลล์มีไคทิน ได้อาหารโดยปล่อยเอนไซม์ย่อยภายนอกแล้วดูดซึม มีทั้งยีสต์เซลล์เดียว ราเส้นใย และเห็ด เป็นผู้ย่อยสลายหลักของระบบนิเวศ',
    introEn: 'Eukaryotes with chitin cell walls that digest food outside the cell and absorb it. They include single-celled yeasts, filamentous molds and mushrooms, and are major decomposers.',
    phyla: [['Chytridiomycota', ''], ['Zygomycota', 'Mucoromycota'], ['Glomeromycota', ''], ['Ascomycota', ''], ['Basidiomycota', '']] },
  { id: 'protists', th: 'โพรทิสต์', en: 'Protists', domain: 'Eukarya', domainTh: '', domainEn: '', rankTh: 'ซูเปอร์กรุ๊ป', rankEn: 'Supergroup',
    introTh: 'ยูแคริโอตที่ไม่ใช่พืช สัตว์ หรือฟังไจ จึงไม่ได้เป็นกลุ่มทางวิวัฒนาการเดียวกัน เว็บนี้จัดตาม 4 ซูเปอร์กรุ๊ป มีทั้งสาหร่ายที่สังเคราะห์ด้วยแสง ผู้ล่าเซลล์เดียว และปรสิตสำคัญทางการแพทย์',
    introEn: 'Eukaryotes that are not plants, animals or fungi, so they do not form one evolutionary group. This site sorts them into four supergroups: photosynthetic algae, single-celled predators and major parasites.',
    phyla: [['Excavata', ''], ['SAR', ''], ['Archaeplastida', ''], ['Unikonta', '']] },
  { id: 'plants', th: 'พืช', en: 'Plants', domain: 'Eukarya', domainTh: '', domainEn: '', rankTh: 'ไฟลัม', rankEn: 'Phylum',
    introTh: 'ยูแคริโอตหลายเซลล์ที่สังเคราะห์ด้วยแสง ผนังเซลล์มีเซลลูโลส และมีวงชีวิตแบบสลับรุ่นระหว่างแกมีโทไฟต์กับสปอโรไฟต์ พืชบกวิวัฒนาการมาจากสาหร่ายสีเขียวในกลุ่ม Archaeplastida',
    introEn: 'Multicellular photosynthetic eukaryotes with cellulose walls and an alternation of generations between gametophyte and sporophyte. Land plants evolved from green algae within Archaeplastida.',
    phyla: [['Bryophyta', ''], ['Hepatophyta', ''], ['Lycophyta', ''], ['Pterophyta', ''], ['Cycadophyta', ''], ['Ginkgophyta', ''], ['Coniferophyta', ''], ['Gnetophyta', ''], ['Anthophyta', ''], ['Anthocerophyta', '']] },
  { id: 'animals', th: 'สัตว์', en: 'Animals', domain: 'Eukarya', domainTh: '', domainEn: '', rankTh: 'ไฟลัม', rankEn: 'Phylum',
    introTh: 'ยูแคริโอตหลายเซลล์ที่ไม่มีผนังเซลล์ กินสิ่งมีชีวิตอื่นแล้วย่อยภายในร่างกาย หนังสือเรียนจัดกลุ่มตามสมมาตร จำนวนชั้นเนื้อเยื่อ และช่องตัว',
    introEn: 'Multicellular eukaryotes without cell walls that eat other organisms and digest them inside the body. Textbooks sort them by symmetry, germ layers and body cavity.',
    phyla: [['Porifera', ''], ['Cnidaria', ''], ['Platyhelminthes', ''], ['Nematoda', ''], ['Annelida', ''], ['Mollusca', ''], ['Arthropoda', ''], ['Echinodermata', ''], ['Chordata', '']] }
];

var INFO_EN = {"Bacteria": "Prokaryotes whose cell walls contain peptidoglycan and whose membrane lipids are fatty acids joined by ester bonds. Archaea use ether bonds and lack peptidoglycan.", "Archaea": "Prokaryotes with no peptidoglycan, membrane lipids joined by ether bonds, and gene transcription machinery like that of eukaryotes, so they form a domain separate from bacteria.", "Eukarya": "Organisms whose cells have a nucleus and membrane-bound organelles such as mitochondria. Neither prokaryote domain has a nuclear membrane.", "Fungi": "Eukaryotes with chitin cell walls that digest food outside the body and absorb it, and store food as glycogen. They are closer to animals than to plants.", "Plantae": "Multicellular photosynthetic eukaryotes with chlorophyll a and b and cellulose walls, whose embryos develop inside the parent plant, which green algae do not do.", "Animalia": "Multicellular eukaryotes without cell walls that eat other organisms and digest them inside the body, pass through a blastula stage, and mostly have nerve and muscle tissue.", "Proteobacteria": "The largest and most varied phylum of Gram-negative bacteria, with an outer membrane containing lipopolysaccharide. Its classes are named by Greek letters such as alpha, beta and gamma.", "Firmicutes": "Gram-positive bacteria with a thick peptidoglycan wall and no outer membrane, low G+C DNA, and many endospore formers.", "Cyanobacteria": "The only bacteria that carry out oxygen-releasing photosynthesis like plants, with chlorophyll a and thylakoids. They gave rise to chloroplasts.", "Actinobacteria": "Gram-positive bacteria with high G+C DNA. Many grow as branching filaments, and they are the source of many antibiotics.", "Spirochaetes": "Long spiral bacteria with flagella between the outer membrane and the cell wall (endoflagella), so the whole cell twists to move.", "Gammaproteobacteria": "The class of Proteobacteria with the most medically important species, such as gut bacteria and Vibrio. Most are rods.", "Alphaproteobacteria": "Proteobacteria, many of which live in close partnership with plants or animals. This group gave rise to mitochondria.", "Betaproteobacteria": "Proteobacteria that mostly live in soil and water, use a wide range of organic compounds, and in a few cases cause human disease.", "Epsilonproteobacteria": "Curved or spiral Proteobacteria that need little oxygen and often live in animal guts. They have since been raised to the phylum Campylobacterota.", "Enterobacterales": "Gram-negative rods that can live with or without oxygen, ferment glucose, and mostly lack the enzyme oxidase.", "Enterobacteriaceae": "The gut bacteria family: Gram-negative, oxidase-negative rods that reduce nitrate and live in the intestines of people and animals.", "Rhizobiales": "An order in which many species are tied to plant roots, either fixing nitrogen in root nodules or causing plant tumors.", "Rhizobiaceae": "Soil rods that live with plant roots. Some form nitrogen-fixing nodules on legumes; others cause galls.", "Vibrionales": "Curved Gram-negative rods that live in water and tolerate salt. Most are oxidase-positive, unlike the oxidase-negative Enterobacterales.", "Vibrionaceae": "Curved rods with a flagellum at one pole, living in brackish water and seawater.", "Campylobacterales": "Short spiral bacteria that need little oxygen and live in the mucus lining of the gut.", "Helicobacteraceae": "Spiral bacteria with several flagella at the poles that live in the stomach or intestine of animals.", "Burkholderiales": "Gram-negative rods in soil and water that use many kinds of organic compounds.", "Burkholderiaceae": "Soil and water bacteria resistant to many antibiotics; some cause disease in people and animals.", "Bacilli": "Firmicutes that can use oxygen (required or optional), as rods or spheres. Clostridia, by contrast, mostly cannot use oxygen.", "Clostridia": "Firmicutes that mostly cannot use oxygen; many form endospores.", "Bacillales": "Gram-positive bacteria that make catalase, and many form endospores. Lactobacillales are catalase-negative.", "Bacillaceae": "Gram-positive rods that form endospores in the presence of oxygen and withstand heat and drying.", "Staphylococcaceae": "Gram-positive spheres in grape-like clusters, catalase-positive and salt-tolerant.", "Lactobacillales": "The lactic acid bacteria: Gram-positive, catalase-negative, acid-tolerant, and fermenting sugar to lactic acid.", "Lactobacillaceae": "Gram-positive rods that ferment sugar to lactic acid, used in fermented foods and found in the gut.", "Streptococcaceae": "Gram-positive spheres in pairs or chains and catalase-negative, unlike staphylococci, which form clusters and are catalase-positive.", "Clostridiales": "Gram-positive rods that cannot use oxygen, form endospores, and often make potent toxins.", "Clostridiaceae": "Endospore-forming Gram-positive rods that cannot use oxygen, found in soil, sediment and the gut.", "Cyanophyceae": "The traditional single class of cyanobacteria, covering single cells, colonies and filaments.", "Oscillatoriales": "Filamentous cyanobacteria without heterocysts, unlike Nostocales, which make heterocysts to fix nitrogen.", "Oscillatoriaceae": "Straight filaments that glide and sway, made of short disc-like cells stacked together.", "Microcoleaceae": "Filamentous cyanobacteria without heterocysts; some genera coil into a helix, such as spirulina.", "Nostocales": "Filamentous cyanobacteria that make heterocysts to fix nitrogen and akinetes to rest.", "Nostocaceae": "Unbranched filaments of round cells like a string of beads, with heterocysts at intervals.", "Actinomycetes": "The main class of Actinobacteria, including filamentous soil species and pathogens.", "Streptomycetales": "Actinobacteria that grow as branching mold-like hyphae and form chains of spores at the tips.", "Streptomycetaceae": "Filamentous soil bacteria that make many antibiotics and the geosmin behind the smell of soil.", "Mycobacteriales": "Actinobacteria whose cell walls contain mycolic acids, which make them acid-fast.", "Mycobacteriaceae": "Rods with waxy, mycolic acid-rich walls that grow slowly and resist chemicals and drying.", "Spirochaetia": "The class of spirochetes; all have endoflagella.", "Spirochaetales": "Very thin spirochetes that need little or no oxygen.", "Treponemataceae": "Spirochetes that often live in people and animals and are hard to culture in the lab.", "Leptospirales": "Tightly coiled spirochetes with hooked ends that need oxygen, unlike Spirochaetales.", "Leptospiraceae": "Spirochetes that use long-chain fatty acids as a carbon source, found in water, soil and animal kidneys.", "Euryarchaeota": "The most varied archaeal phylum, including methane makers, extreme salt lovers and some heat lovers.", "Crenarchaeota": "Archaea that are mostly extreme heat lovers; many use or produce sulfur compounds.", "Thaumarchaeota": "Ammonia-oxidizing archaea that are common in ordinary seas and soils, not only extreme places.", "Halobacteria": "Extreme salt-loving archaea that need very concentrated salt, pack potassium into the cell to balance water, and are often red from carotenoids.", "Halobacteriales": "The original order of salt-loving archaea; many carry bacteriorhodopsin in the membrane.", "Halobacteriaceae": "Mostly rod-shaped salt lovers that can use light for extra energy through bacteriorhodopsin.", "Haloferacales": "Salt-loving archaea split off from Halobacteriales on the basis of genome data.", "Haloferacaceae": "Salt-loving archaea whose cells are often flat and irregular.", "Methanobacteria": "Methane-making archaea with pseudopeptidoglycan walls that mainly use hydrogen and carbon dioxide.", "Methanobacteriales": "Rod-shaped methane makers with pseudopeptidoglycan walls.", "Methanobacteriaceae": "Methane makers found in animal guts, sediments and sewage treatment.", "Methanococci": "Spherical methane makers wrapped only in an S-layer, unlike Methanobacteria with pseudopeptidoglycan walls.", "Methanococcales": "Spherical marine methane makers, many of them heat lovers.", "Methanocaldococcaceae": "Methane makers that thrive in extreme heat at deep-sea hydrothermal vents.", "Methanomicrobia": "Methane makers that can use several starting materials such as acetate and methanol, not just hydrogen.", "Methanosarcinales": "Methane makers that can use acetate, methanol and methylamines.", "Methanosarcinaceae": "Methane makers whose cells often clump together; the main methane producers in digesters.", "Thermococci": "Spherical extreme heat lovers that do not use oxygen, ferment peptides and reduce sulfur to hydrogen sulfide.", "Thermococcales": "Extreme heat lovers that swim with many flagella, found at deep-sea hydrothermal vents.", "Thermococcaceae": "Spherical archaea that grow best near 100 °C; a source of heat-stable enzymes for PCR.", "Thermoplasmata": "Archaea without cell walls that like heat and strong acid.", "Thermoplasmatales": "Wall-less archaea that hold their shape with special membrane lipids.", "Thermoplasmataceae": "Irregular archaea living at about 60 °C in strong acid.", "Thermoprotei": "The main class of Crenarchaeota: extreme heat lovers, many of them acid lovers or sulfur users.", "Sulfolobales": "Lobed spherical archaea that like heat and strong acid, use oxygen and can oxidize sulfur.", "Sulfolobaceae": "Archaea from acidic hot springs; a model for studying archaeal cell division.", "Nitrososphaeria": "Archaea that oxidize ammonia to nitrite with the enzyme ammonia monooxygenase.", "Nitrosopumilales": "The most abundant ammonia-oxidizing archaea in the ocean.", "Nitrosopumilaceae": "Tiny rods that do well on very low ammonia and fix carbon dioxide.", "Chytridiomycota": "The only fungi with swimming zoospores, each with a single flagellum; mostly aquatic.", "Zygomycota": "Molds whose hyphae have no cross walls and that reproduce sexually through thick-walled zygospores. Ascomycetes and basidiomycetes have cross wall en dark.", "Sordariaceae": "Molds whose ascospores line up in the ascus in the order of cell division, which makes them useful in genetics.", "Hypocreales": "Ascomycetes, often brightly colored, many of them parasites of insects or other fungi.", "Cordycipitaceae": "Insect-parasitic fungi that grow soft, brightly colored fruiting bodies out of the insect.", "Pneumocystidomycetes": "Fungi that live in mammal lungs and have almost no ergosterol in their membranes.", "Pneumocystidales": "Lung fungi that cannot be grown outside the body.", "Pneumocystidaceae": "Fungi unaffected by the antifungals that target ergosterol.", "Agaricomycetes": "Basidiomycetes that form large mushrooms, such as gilled mushrooms, bracket fungi and boletes.", "Agaricales": "Mushrooms with gills under the cap; the largest mushroom order.", "Pluteaceae": "Gilled mushrooms whose gills are free of the stem and whose spores are pink; some genera have a cup at the base (volva).", "Pleurotaceae": "Mushrooms with an off-center or side stem and gills that run down the stem, growing on wood.", "Lyophyllaceae": "Gilled mushrooms with white spores; some genera live with termites.", "Tremellomycetes": "Basidiomycetes, many with a yeast stage; some form jelly-like fruiting bodies.", "Tremellales": "Basidiomycetes with both yeast and hyphal stages.", "Cryptococcaceae": "Yeasts wrapped in a thick polysaccharide capsule.", "Pucciniomycetes": "Rust fungi: specialized plant parasites with complex life cycles.", "Pucciniales": "Rusts, many of which need two host plants to finish the life cycle.", "Pucciniaceae": "Rusts that make several kinds of spores within one life cycle.", "Excavata": "Single-celled protists, many with a feeding groove along one side and modified or reduced mitochondria.", "SAR": "A supergroup defined by DNA evidence that combines three groups: stramenopiles, alveolates and rhizarians.", "Archaeplastida": "Groups whose chloroplasts came from primary endosymbiosis (two membranes): red algae, g sest to land plants, for example in how they divide the cytoplasm.", "Zygnematophyceae": "Green algae with no flagella at any stage that reproduce by conjugation; the closest relatives of land plants.", "Rhodophyta": "Red algae with phycoerythrin and no flagella at any stage.", "Bangiophyceae": "Red algae with one star-shaped chloroplast per cell; some form thin sheets, such as nori.", "Amoebozoa": "Protists that move with lobe-shaped pseudopodia, including amoebae and slime molds.", "Tubulinea": "Amoebae with tube- or rod-shaped pseudopodia that flow in one direction.", "Myxogastria": "Plasmodial slime molds: one mass of cytoplasm with an enormous number of nuclei.", "Dictyostelia": "Cellular slime molds that live as separate amoebae and gather when food runs out, unlike plasmodial slime molds.", "Archamoebae": "Amoebae without normal mitochondria living in oxygen-free places, including gut parasites.", "Bryophyta": "Mosses: no vascular tissue, a dominant gametophyte, multicellular rhizoids and small leaves around the stem.", "Hepatophyta": "Liverworts: no vascular tissue and no stomata, single-celled rhizoids, and usually a flat thallus.", "Anthocerophyta": "Hornworts: horn-shaped sporophytes that keep growing from the base and have stomata, which liverworts lack.", "Lycophyta": "Vascular plants whose leaves are microphylls with a single vein and whose spores form in strobili.", "Pterophyta": "Ferns and relatives: vascular tissue but no seeds, megaphyll leaves, and water needed for fertilization.", "Cycadophyta": "Cycads: palm-like naked-seed plants with separate male and female plants and swimming sperm.", "Ginkgophyta": "One living species, with fan-shaped deciduous leaves and swimming sperm.", "Coniferophyta": "Conifers: needle or scale leaves, seeds on cone scales, and wind-blown pollen.", "Gnetophyta": "Naked-seed plants with vessels in the xylem like flowering plants; only three very different genera.", "Anthophyta": "Flowering plants: seeds inside an ovary h water-repellent hairs on the leaves.", "Polypodiales": "The largest fern order, with sporangia grouped into sori under the leaf.", "Athyriaceae": "Ground ferns whose sori are usually long and lie along the veins.", "Cycadopsida": "The cycad class.", "Cycadales": "Cycads with coralloid roots that host cyanobacteria.", "Cycadaceae": "Cycads whose female plants carry seeds on loosely arranged seed leaves rather than a tight cone.", "Ginkgoopsida": "The ginkgo class.", "Ginkgoales": "The ginkgo order, with a single surviving species.", "Ginkgoaceae": "Fan-shaped leaves with veins forking repeatedly, and a foul-smelling outer seed coat.", "Pinopsida": "The conifer class, with needle or scale leaves and seeds on cone scales.", "Pinales": "Most conifers, such as pines and araucarias.", "Pinaceae": "Conifers with needles in bundles, woody female cones and winged seeds.", "Gnetopsida": "The gnetophyte class.", "Gnetales": "Climbers or trees of tropical forest with broad, net-veined leaves like flowering plants.", "Gnetaceae": "A single genus, Gnetum, whose seeds have a soft orange-red coat.", "Welwitschiales": "One desert species whose two leaves grow from the base for life, unlike the forest climbers of Gnetales.", "Welwitschiaceae": "A family with one species, Welwitschia.", "Liliopsida": "Monocots: one seed leaf, parallel veins, scattered vascular bundles, flower parts in threes, and fibrous roots.", "Magnoliopsida": "Dicots: two seed leaves, net veins, vascular bundles in a ring, flower parts in fours or fives, and a taproot.", "Poales": "Grasses and relatives with small, reduced, wind-pollinated flowers.", "Poaceae": "Grasses: hollow jointed stems, flowers in spikelets, and a grain whose seed coat is fused to the fruit wall.", "Proteales": "An order defined by DNA evidence that joins the sacred lotus with very different land plants.", "Nelumbonaceae": "Sacred lotus: round leaves held above water and a swollen receptacle (the seed pod) with fruits sunk in it. Water lilies belong to a different family.", "Malvales": "The order of hibiscus, cotton and durian; many have mucilage in their tissues.", "Malvaceae": "Stamens often fused into a tube, and star-shaped hairs on stems and leaves.", "Malpighiales": "A large, very varied order of flowering plants grouped by DNA evidence.", "Euphorbiaceae": "Rubber and cassava; many have white latex and fruits that split into three lobes.", "Rafflesiaceae": "Parasitic plants with no visible leaves, stems or roots, only huge flowers that emerge from the host vine.", "Fabales": "The order of legumes and their relatives.", "Fabaceae": "Legumes: fruit is a pod, and many have root nodules where rhizobia fix nitrogen.", "Brassicales": "Plants that make glucosinolates, which taste sharp and pungent when the tissue is damaged.", "Brassicaceae": "The cabbage family, with four petals arranged in a cross.", "Porifera": "No true tissues, a body full of pores, and collar cells that filter food.", "Cnidaria": "Radial symmetry, two tissue layers, a gut with a single opening, and stinging cells.", "Platyhelminthes": "Flatworms: bilateral symmetry, three tissue layers, no body cavity, and a gut with one opening or none.", "Nematoda": "Roundworms: unsegmented, a pseudocoelom, a complete gut, and a molted cuticle.", "Annelida": "Segmented worms with repeated segments, a true coelom and a closed circulatory system.", "Mollusca": "Soft-bodied animals with a mantle that often makes a shell, a muscular foot, and in many a radula for scraping food.", "Arthropoda": "A chitin exoskeleton, jointed appendages, a segmented body, and molting to grow.", "Echinodermata": "Adults have fivefold radial symmetry, a water vascular system with tube feet, and are deuterostomes like chordates.", "Chordata": "At some stage of life: a notochord, a hollow dorsal nerve cord, gill slits and a tail past the anus.", "Demospongiae": "Sponges supported by spongin protein fibers and silica spicules; the largest sponge class.", "Spongillida": "Freshwater sponges.", "Spongillidae": "Freshwater sponges that make gemmules to survive drought or cold.", "Scyphozoa": "True jellyfish: a large, dominant medusa and a small polyp stage.", "Semaeostomeae": "Jellyfish with long, frilly oral arms and tentacles at the bell margin.", "Ulmaridae": "Wide-belled jellyfish with branching gut canals in the bell.", "Hydrozoa": "Cnidarians in which the polyp stage usually dominates and many form colonies, unlike Scyphozoa where the medusa dominates.", "Anthoathecata": "Hydroids whose polyps have no protective covering.", "Hydridae": "Solitary freshwater hydras with no medusa stage.", "Turbellaria": "Free-living flatworms with cilia on the skin for movement (a textbook name; current systems no longer use it as a class).", "Tricladida": "Planarians, whose gut branches into three.", "Dugesiidae": "Freshwater planarians with a triangular head and two eyespots.", "Trematoda": "Flukes: parasites with suckers whose life cycle passes through a snail as intermediate host.", "Opisthorchiida": "Flukes passed on by eating raw fish.", "Opisthorchiidae": "Flukes living in the bile ducts of people and fish-eating animals.", "Cestoda": "Tapeworms: no gut, food absorbed through the skin, and a long chain of flat segments. Flukes, by contrast, have a gut.", "Cyclophyllidea": "Tapeworms with four suckers on the head.", "Taeniidae": "Tapeworms whose larvae form cysts in the muscles or organs of the intermediate host.", "Chromadorea": "A large class of roundworms, including free-living species and many parasites.", "Rhabditida": "A large order of roundworms, including C. elegans and many human parasites.", "Rhabditidae": "Small free-living soil roundworms that eat bacteria.", "Ascarididae": "Large roundworms with three lips around the mouth that live in the intestine.", "Gnathostomatidae": "Roundworms with a swollen head ringed with spines.", "Clitellata": "Segmented worms with a clitellum for making egg cocoons and few or no bristles, such as earthworms and leeches.", "Arhynchobdellida": "Leeches without a proboscis that feed with jaws or a muscular pharynx.", "Hirudinidae": "Blood-sucking leeches with three jaws.", "Polychaeta": "Marine segmented worms with parapodia and many bristles on each segment, unlike Clitellata with few bristles.", "Phyllodocida": "Marine worms, mostly predators, with jaws that can be pushed out.", "Nereididae": "Marine worms with tentacles and eyes on the head and a pair of jaws.", "Gastropoda": "Snails and slugs whose bodies twist (torsion) during development, bringing the mantle cavity to the front.", "Architaenioglossa": "Freshwater snails with a lid (operculum) that closes the shell.", "Ampullariidae": "Freshwater apple snails with both a gill and a lung, so they can breathe air.", "Bivalvia": "Two-shelled molluscs with no head or radula that filter food with their gills.", "Cardiida": "Bivalves whose shells often have radiating ribs or grooves.", "Cardiidae": "Cockles and giant clams, with shells that often have radiating ribs.", "Cephalopoda": "Squid and relatives: arms around the mouth, a complex nervous system and a closed circulatory system.", "Nautilida": "Cephalopods that still have an outer chambered shell, unlike most squid where the shell is reduced or gone.", "Nautilidae": "Nautiluses, with many arms that have no suckers.", "Insecta": "Insects: three body parts, three pairs of legs, one pair of antennae, and usually wings.", "Diptera": "Insects with one pair of wings; the hind pair is reduced to balancing knobs (halteres).", "Culicidae": "Mosquitoes, with piercing-sucking mouthparts, scaled wings and aquatic larvae.", "Drosophilidae": "Small fruit flies whose larvae eat yeast on fermenting fruit.", "Blattodea": "Cockroaches and termites, with leathery forewings, chewing mouthparts and incomplete metamorphosis.", "Blattidae": "Large cockroaches that live around people.", "Lepidoptera": "Butterflies and moths, with scaled wings, a coiled sucking proboscis in adults, an
