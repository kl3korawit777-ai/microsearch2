var INFO = {"Bacteria": "โพรแคริโอตที่ผนังเซลล์มีเพปทิโดไกลแคน และลิพิดของเยื่อหุ้มเซลล์เป็นกรดไขมันต่อด้วยพันธะเอสเทอร์ ต่างจากอาร์เคียที่ใช้พันธะอีเทอร์และไม่มีเพปทิโดไกลแคน", "Archaea": "โพรแคริโอตที่ไม่มีเพปทิโดไกลแคน ลิพิดของเยื่อหุ้มเซลล์ต่อด้วยพันธะอีเทอร์ และกลไกถอดรหัสยีนคล้ายของยูแคริโอต จึงแยกเป็นโดเมนต่างหากจากแบคทีเรีย", "Eukarya": "สิ่งมีชีวิตที่เซลล์มีนิวเคลียสและออร์แกเนลล์ที่มีเยื่อหุ้ม เช่น ไมโทคอนเดรีย ต่างจากโพรแคริโอตทั้งสองโดเมนที่ไม่มีเยื่อหุ้มนิวเคลียส", "Fungi": "ยูแคริโอตที่ผนังเซลล์มีไคทิน ได้อาหารโดยปล่อยเอนไซม์ย่อยภายนอกแล้วดูดซึม และเก็บอาหารเป็นไกลโคเจน จึงใกล้ชิดกับสัตว์มากกว่าพืช", "Plantae": "ยูแคริโอตหลายเซลล์ที่สังเคราะห์ด้วยแสง มีคลอโรฟิลล์ เอ และ บี ผนังเซลล์มีเซลลูโลส และเอ็มบริโอเจริญอยู่ในเนื้อเยื่อของต้นแม่ ซึ่งสาหร่ายสีเขียวไม่มี", "Animalia": "ยูแคริโอตหลายเซลล์ที่ไม่มีผนังเซลล์ กินสิ่งมีชีวิตอื่นแล้วย่อยภายในร่างกาย มีระยะบลาสทูลาระหว่างการเจริญ และส่วนใหญ่มีเนื้อเยื่อประสาทและกล้ามเนื้อ", "Proteobacteria": "ไฟลัมแบคทีเรียแกรมลบที่ใหญ่และหลากหลายที่สุด มีเยื่อหุ้มชั้นนอกที่มีลิโพพอลิแซ็กคาไรด์ และแบ่งคลาสตามอักษรกรีก เช่น แอลฟา บีตา แกมมา", "Firmicutes": "แบคทีเรียแกรมบวกที่ผนังเพปทิโดไกลแคนหนาและไม่มีเยื่อหุ้มชั้นนอก ดีเอ็นเอมีสัดส่วน G+C ต่ำ และหลายชนิดสร้างเอนโดสปอร์", "Cyanobacteria": "แบคทีเรียกลุ่มเดียวที่สังเคราะห์ด้วยแสงแบบปล่อยออกซิเจนเหมือนพืช มีคลอโรฟิลล์ เอ และไทลาคอยด์ และเป็นต้นกำเนิดของคลอโรพลาสต์", "Actinobacteria": "แบคทีเรียแกรมบวกที่ดีเอ็นเอมีสัดส่วน G+C สูง หลายชนิดเจริญเป็นเส้นสายแตกแขนง และเป็นแหล่งของยาปฏิชีวนะจำนวนมาก", "Spirochaetes": "แบคทีเรียรูปเกลียวยาวที่มีแฟลเจลลัมอยู่ระหว่างเยื่อหุ้มชั้นนอกกับผนังเซลล์ (เอนโดแฟลเจลลัม) จึงเคลื่อนที่ด้วยการบิดตัวทั้งเซลล์", "Gammaproteobacteria": "คลาสของโพรทีโอแบคทีเรียที่มีชนิดสำคัญทางการแพทย์มากที่สุด เช่น แบคทีเรียในลำไส้และวิบริโอ ส่วนใหญ่เป็นรูปแท่ง", "Alphaproteobacteria": "โพรทีโอแบคทีเรียที่หลายชนิดอยู่ร่วมกับพืชหรือสัตว์อย่างใกล้ชิด และเป็นกลุ่มที่ให้กำเนิดไมโทคอนเดรีย", "Betaproteobacteria": "โพรทีโอแบคทีเรียที่ส่วนใหญ่อยู่ในดินและน้ำ ใช้สารอินทรีย์ได้หลากหลาย และบางชนิดก่อโรคในคน", "Epsilonproteobacteria": "โพรทีโอแบคทีเรียรูปโค้งหรือเกลียวที่ต้องการออกซิเจนน้อย มักอยู่ในทางเดินอาหารของสัตว์ ปัจจุบันถูกยกขึ้นเป็นไฟลัม Campylobacterota", "Enterobacterales": "แบคทีเรียแท่งแกรมลบที่ใช้หรือไม่ใช้ออกซิเจนก็ได้ หมักกลูโคสได้ และส่วนใหญ่ไม่สร้างเอนไซม์ออกซิเดส", "Enterobacteriaceae": "วงศ์ของแบคทีเรียลำไส้ รูปแท่งแกรมลบ ออกซิเดสลบ และรีดิวซ์ไนเตรตได้ พบในลำไส้ของคนและสัตว์", "Rhizobiales": "อันดับที่หลายชนิดเกี่ยวข้องกับรากพืช ทั้งตรึงไนโตรเจนในปมรากและก่อเนื้องอกในพืช", "Rhizobiaceae": "แบคทีเรียแท่งในดินที่อยู่ร่วมกับรากพืช บางชนิดสร้างปมตรึงไนโตรเจนในพืชตระกูลถั่ว บางชนิดก่อปุ่มปมในพืช", "Vibrionales": "แบคทีเรียแท่งโค้งแกรมลบที่อยู่ในน้ำและทนเกลือ ส่วนใหญ่ออกซิเดสบวก ต่างจาก Enterobacterales ที่ออกซิเดสลบ", "Vibrionaceae": "แบคทีเรียแท่งโค้งที่มีแฟลเจลลัมที่ขั้วเซลล์ อยู่ในน้ำกร่อยและน้ำทะเล", "Campylobacterales": "แบคทีเรียเกลียวสั้นที่ต้องการออกซิเจนน้อย อาศัยในเยื่อเมือกของทางเดินอาหาร", "Helicobacteraceae": "แบคทีเรียรูปเกลียวที่มีแฟลเจลลัมหลายเส้นที่ขั้วเซลล์ อาศัยในกระเพาะหรือลำไส้ของสัตว์", "Burkholderiales": "แบคทีเรียแท่งแกรมลบในดินและน้ำที่ใช้สารอินทรีย์ได้หลากหลาย", "Burkholderiaceae": "แบคทีเรียในดินและน้ำที่ทนยาปฏิชีวนะหลายชนิด บางชนิดก่อโรคในคนและสัตว์", "Bacilli": "คลาสของเฟอร์มิคิวทีที่ใช้ออกซิเจนได้ (ต้องใช้หรือใช้ก็ได้) มีทั้งรูปแท่งและทรงกลม ต่างจาก Clostridia ที่ส่วนใหญ่ไม่ใช้ออกซิเจน", "Clostridia": "คลาสของเฟอร์มิคิวทีที่ส่วนใหญ่ไม่ใช้ออกซิเจน และหลายชนิดสร้างเอนโดสปอร์", "Bacillales": "แบคทีเรียแกรมบวกที่สร้างเอนไซม์คาตาเลส และหลายชนิดสร้างเอนโดสปอร์ ต่างจาก Lactobacillales ที่คาตาเลสลบ", "Bacillaceae": "แท่งแกรมบวกที่สร้างเอนโดสปอร์ได้ในที่มีออกซิเจน ทนความร้อนและความแห้งแล้ง", "Staphylococcaceae": "ทรงกลมแกรมบวกที่เรียงเป็นกลุ่มคล้ายพวงองุ่น คาตาเลสบวก และทนเกลือได้ดี", "Lactobacillales": "แบคทีเรียกรดแล็กติก แกรมบวก คาตาเลสลบ ทนกรด และหมักน้ำตาลได้กรดแล็กติก", "Lactobacillaceae": "แท่งแกรมบวกที่หมักน้ำตาลเป็นกรดแล็กติก ใช้ในอาหารหมักและพบในทางเดินอาหาร", "Streptococcaceae": "ทรงกลมแกรมบวกที่เรียงเป็นคู่หรือสายโซ่ คาตาเลสลบ ต่างจากสแตฟิโลค็อกคัสที่เรียงเป็นพวงและคาตาเลสบวก", "Clostridiales": "แท่งแกรมบวกที่ไม่ใช้ออกซิเจน สร้างเอนโดสปอร์ และหลายชนิดสร้างสารพิษรุนแรง", "Clostridiaceae": "แท่งแกรมบวกไม่ใช้ออกซิเจนที่สร้างเอนโดสปอร์ พบในดิน ตะกอน และลำไส้", "Cyanophyceae": "คลาสของไซยาโนแบคทีเรียในระบบแบบดั้งเดิม รวมทั้งชนิดเซลล์เดียว โคโลนี และเส้นสาย", "Oscillatoriales": "ไซยาโนแบคทีเรียเส้นสายที่ไม่มีเฮเทอโรซิสต์ ต่างจาก Nostocales ที่มีเฮเทอโรซิสต์ไว้ตรึงไนโตรเจน", "Oscillatoriaceae": "เส้นสายตรงที่เคลื่อนที่แบบไถลและโบกไปมาได้ เซลล์สั้นเรียงซ้อนกันเป็นแผ่น", "Microcoleaceae": "ไซยาโนแบคทีเรียเส้นสายที่ไม่มีเฮเทอโรซิสต์ บางสกุลขดเป็นเกลียว เช่น สไปรูลินา", "Nostocales": "ไซยาโนแบคทีเรียเส้นสายที่สร้างเฮเทอโรซิสต์สำหรับตรึงไนโตรเจน และเอไคนีตสำหรับพักตัว", "Nostocaceae": "เส้นสายไม่แตกแขนง เซลล์กลมเรียงคล้ายลูกปัด และมีเฮเทอโรซิสต์แทรกเป็นระยะ", "Actinomycetes": "คลาสหลักของแอกทิโนแบคทีเรีย รวมทั้งชนิดที่เป็นเส้นสายในดินและชนิดก่อโรค", "Streptomycetales": "แอกทิโนแบคทีเรียที่เจริญเป็นเส้นใยแตกแขนงคล้ายรา และสร้างสปอร์เป็นสายที่ปลายเส้นใย", "Streptomycetaceae": "แบคทีเรียเส้นใยในดินที่สร้างยาปฏิชีวนะจำนวนมาก และสารจีออสมินที่ให้กลิ่นดิน", "Mycobacteriales": "แอกทิโนแบคทีเรียที่ผนังเซลล์มีกรดไมโคลิก ทำให้ย้อมติดสีทนกรด", "Mycobacteriaceae": "แท่งที่ผนังเซลล์มีไขมันสูงจากกรดไมโคลิก เติบโตช้า และทนสารเคมีกับความแห้งได้ดี", "Spirochaetia": "คลาสของสไปโรคีต ทุกชนิดมีเอนโดแฟลเจลลัม", "Spirochaetales": "สไปโรคีตที่เกลียวบางมาก ต้องการออกซิเจนน้อยหรือไม่ใช้เลย", "Treponemataceae": "สไปโรคีตที่หลายชนิดอาศัยในคนและสัตว์ และเพาะเลี้ยงในห้องปฏิบัติการได้ยาก", "Leptospirales": "สไปโรคีตที่เกลียวถี่และปลายงอเป็นตะขอ ต้องใช้ออกซิเจน ต่างจาก Spirochaetales", "Leptospiraceae": "สไปโรคีตที่ใช้กรดไขมันสายยาวเป็นแหล่งคาร์บอน พบในน้ำ ดิน และไตของสัตว์", "Euryarchaeota": "ไฟลัมที่หลากหลายที่สุดของอาร์เคีย รวมทั้งพวกสร้างมีเทน พวกชอบเค็มจัด และพวกชอบร้อนบางกลุ่ม", "Crenarchaeota": "อาร์เคียที่ส่วนใหญ่ชอบร้อนจัด และหลายชนิดใช้หรือสร้างสารประกอบกำมะถัน", "Thaumarchaeota": "อาร์เคียที่ออกซิไดซ์แอมโมเนีย พบมากในทะเลและดินทั่วไป ไม่ได้อยู่เฉพาะที่สุดขั้ว", "Halobacteria": "อาร์เคียชอบเค็มจัดที่ต้องการเกลือเข้มข้นมาก สะสมโพแทสเซียมในเซลล์เพื่อรักษาสมดุลน้ำ และมักเป็นสีแดงจากแคโรทีนอยด์", "Halobacteriales": "อาร์เคียชอบเค็มกลุ่มดั้งเดิม หลายชนิดมีแบคทีริโอโรดอปซินในเยื่อหุ้มเซลล์", "Halobacteriaceae": "อาร์เคียชอบเค็มที่ส่วนใหญ่เป็นรูปแท่ง และใช้แสงเสริมพลังงานผ่านแบคทีริโอโรดอปซินได้", "Haloferacales": "อาร์เคียชอบเค็มที่ถูกแยกออกจาก Halobacteriales ตามข้อมูลจีโนม", "Haloferacaceae": "อาร์เคียชอบเค็มที่เซลล์มักแบนและรูปร่างไม่แน่นอน", "Methanobacteria": "อาร์เคียสร้างมีเทนที่ผนังเซลล์มีซูโดเพปทิโดไกลแคน และใช้ไฮโดรเจนกับคาร์บอนไดออกไซด์เป็นหลัก", "Methanobacteriales": "อาร์เคียสร้างมีเทนรูปแท่ง ผนังเซลล์เป็นซูโดเพปทิโดไกลแคน", "Methanobacteriaceae": "อาร์เคียสร้างมีเทนที่พบในลำไส้สัตว์ ตะกอน และบ่อบำบัดน้ำเสีย", "Methanococci": "อาร์เคียสร้างมีเทนทรงกลมที่มีเพียงชั้น S-layer ห่อหุ้มเซลล์ ต่างจาก Methanobacteria ที่มีผนังซูโดเพปทิโดไกลแคน", "Methanococcales": "อาร์เคียสร้างมีเทนทรงกลมที่อยู่ในทะเล หลายชนิดชอบร้อน", "Methanocaldococcaceae": "อาร์เคียสร้างมีเทนที่ชอบร้อนจัด อาศัยที่ปล่องน้ำร้อนใต้ทะเลลึก", "Methanomicrobia": "อาร์เคียสร้างมีเทนที่ใช้สารตั้งต้นได้หลายชนิด เช่น อะซิเตตและเมทานอล ไม่ได้ใช้แค่ไฮโดรเจน", "Methanosarcinales": "อาร์เคียสร้างมีเทนที่ใช้อะซิเตต เมทานอล และเมทิลามีนได้", "Methanosarcinaceae": "อาร์เคียสร้างมีเทนที่เซลล์มักรวมเป็นกลุ่ม และเป็นผู้ผลิตมีเทนหลักในบ่อหมัก", "Thermococci": "อาร์เคียทรงกลมชอบร้อนจัดที่ไม่ใช้ออกซิเจน หมักเปปไทด์ และรีดิวซ์กำมะถันเป็นไฮโดรเจนซัลไฟด์", "Thermococcales": "อาร์เคียชอบร้อนจัดที่ว่ายน้ำได้ด้วยแฟลเจลลัมหลายเส้น พบตามปล่องน้ำร้อนใต้ทะเล", "Thermococcaceae": "อาร์เคียทรงกลมที่เติบโตได้ดีใกล้ 100 °C เป็นแหล่งเอนไซม์ทนร้อนสำหรับ PCR", "Thermoplasmata": "อาร์เคียที่ไม่มีผนังเซลล์ และชอบที่ร้อนและเป็นกรดจัด", "Thermoplasmatales": "อาร์เคียไม่มีผนังเซลล์ที่รักษารูปร่างเซลล์ด้วยลิพิดพิเศษในเยื่อหุ้ม", "Thermoplasmataceae": "อาร์เคียรูปร่างไม่แน่นอนที่อยู่ในที่ร้อนราว 60 °C และเป็นกรดจัด", "Thermoprotei": "คลาสหลักของเครนอาร์เคียที่ชอบร้อนจัด หลายชนิดชอบกรดหรือใช้กำมะถัน", "Sulfolobales": "อาร์เคียทรงกลมมีพูที่ชอบร้อนและเป็นกรดจัด ใช้ออกซิเจน และออกซิไดซ์กำมะถันได้", "Sulfolobaceae": "อาร์เคียที่อยู่ในบ่อน้ำพุร้อนกรด เป็นต้นแบบในการศึกษาการแบ่งเซลล์ของอาร์เคีย", "Nitrososphaeria": "อาร์เคียที่ออกซิไดซ์แอมโมเนียเป็นไนไตรต์ด้วยเอนไซม์แอมโมเนียโมโนออกซิเจเนส", "Nitrosopumilales": "อาร์เคียออกซิไดซ์แอมโมเนียที่พบมากที่สุดในมหาสมุทร", "Nitrosopumilaceae": "อาร์เคียแท่งเล็กมากที่ใช้แอมโมเนียความเข้มข้นต่ำได้ดี และตรึงคาร์บอนไดออกไซด์", "Chytridiomycota": "ฟังไจกลุ่มเดียวที่มีซูสปอร์ว่ายน้ำได้ด้วยแฟลเจลลัมเส้นเดียว ส่วนใหญ่อยู่ในน้ำ", "Zygomycota": "ราที่เส้นใยไม่มีผนังกั้น สืบพันธุ์แบบอาศัยเพศด้วยไซโกสปอร์ผนังหนา ต่างจากแอสโคไมซีตและเบสิดิโอไมซีตที่เส้นใยมีผนังกั้น", "Glomeromycota": "ฟังไจที่สร้างไมคอร์ไรซาแบบอาร์บัสคูลาร์ในรากพืชบกส่วนใหญ่ และยังไม่พบการสืบพันธุ์แบบอาศัยเพศ", "Ascomycota": "ฟังไจที่สร้างแอสโคสปอร์ในถุงแอสคัส (มักมี 8 สปอร์) เป็นไฟลัมที่ใหญ่ที่สุด รวมทั้งยีสต์ รา และเห็ดถ้วย", "Basidiomycota": "ฟังไจที่สร้างเบสิดิโอสปอร์บนเบสิเดียม (มักมี 4 สปอร์) รวมทั้งเห็ดส่วนใหญ่ ราสนิม และราเขม่า", "Chytridiomycetes": "ไคทริดที่มีแทลลัสเล็กพร้อมไรซอยด์ หลายชนิดเป็นผู้ย่อยสลายหรือปรสิตในน้ำ", "Rhizophydiales": "ไคทริดที่หลายชนิดเป็นปรสิตในสาหร่าย ละอองเรณู หรือสัตว์สะเทินน้ำสะเทินบก", "Mucoromycetes": "ราเติบโตเร็วที่เส้นใยไม่มีผนังกั้น สร้างสปอร์ในอับสปอร์บนก้านชู", "Mucorales": "ราที่ขึ้นบนอาหารและซากพืชอย่างรวดเร็ว บางชนิดก่อโรคในผู้ภูมิคุ้มกันต่ำ", "Mucoraceae": "ราที่อับสปอร์กลมอยู่บนก้านชูตั้งตรง และมีไรซอยด์ยึดอาหาร", "Glomeromycetes": "ราไมคอร์ไรซาที่สร้างอาร์บัสคูลแตกแขนงภายในเซลล์รากพืช", "Glomerales": "ราไมคอร์ไรซาที่สร้างสปอร์ขนาดใหญ่หลายนิวเคลียสในดิน", "Glomeraceae": "วงศ์ที่ใหญ่ที่สุดของราไมคอร์ไรซาอาร์บัสคูลาร์ พบกับพืชเกษตรส่วนใหญ่", "Saccharomycetes": "ยีสต์แท้ที่ส่วนใหญ่เป็นเซลล์เดียว แตกหน่อ และไม่สร้างดอกเห็ด", "Saccharomycetales": "ยีสต์ที่แตกหน่อและหลายชนิดหมักน้ำตาลได้", "Saccharomycetaceae": "ยีสต์ที่หมักน้ำตาลได้แอลกอฮอล์ดี ใช้ทำขนมปังและเครื่องดื่ม", "Debaryomycetaceae": "ยีสต์ที่หลายชนิดสร้างเส้นใยเทียมได้ และบางชนิดอาศัยบนร่างกายคน", "Eurotiomycetes": "แอสโคไมซีตที่ส่วนใหญ่เห็นเป็นราสร้างโคนิเดียจำนวนมาก", "Eurotiales": "ราสีเขียวหรือเหลืองที่สร้างโคนิเดียเป็นสาย หลายชนิดผลิตยาหรือสารพิษ", "Aspergillaceae": "วงศ์ของ Aspergillus และ Penicillium ที่สร้างโคนิเดียเป็นสายบนก้านชู", "Sordariomycetes": "แอสโคไมซีตที่สร้างแอสคัสในโครงสร้างรูปขวด (เพริทีเซียม)", "Sordariales": "แอสโคไมซีตที่ย่อยสลายซากพืชและมูลสัตว์ แอสโคสปอร์มักมีสีเข้ม", "Sordariaceae": "ราที่แอสโคสปอร์เรียงในแอสคัสตามลำดับการแบ่งเซลล์ จึงใช้ศึกษาพันธุศาสตร์", "Hypocreales": "แอสโคไมซีตที่มักมีสีสด หลายชนิดเป็นปรสิตแมลงหรือฟังไจอื่น", "Cordycipitaceae": "ราที่เป็นปรสิตในแมลง และสร้างดอกเนื้อนุ่มสีสดงอกออกจากตัวแมลง", "Pneumocystidomycetes": "ฟังไจที่อาศัยในปอดของสัตว์เลี้ยงลูกด้วยน้ำนม และเยื่อหุ้มเซลล์แทบไม่มีเออร์โกสเตอรอล", "Pneumocystidales": "ฟังไจในปอดที่เพาะเลี้ยงนอกร่างกายไม่ได้", "Pneumocystidaceae": "ฟังไจที่ยาต้านเชื้อรากลุ่มที่ออกฤทธิ์ต่อเออร์โกสเตอรอลใช้ไม่ได้ผล", "Agaricomycetes": "เบสิดิโอไมซีตที่สร้างดอกเห็ดขนาดใหญ่ เช่น เห็ดครีบ เห็ดหิ้ง และเห็ดรู", "Agaricales": "เห็ดที่มีครีบใต้หมวก เป็นอันดับเห็ดที่ใหญ่ที่สุด", "Pluteaceae": "เห็ดครีบที่ครีบไม่ติดก้านและสปอร์สีชมพู บางสกุลมีเปลือกหุ้มโคน (วอลวา)", "Pleurotaceae": "เห็ดที่ก้านเยื้องหรือติดด้านข้างหมวก ครีบลาดลงมาถึงก้าน และขึ้นบนไม้", "Lyophyllaceae": "เห็ดครีบที่สปอร์สีขาว บางสกุลอยู่ร่วมกับปลวก", "Tremellomycetes": "เบสิดิโอไมซีตที่หลายชนิดมีระยะยีสต์ บางชนิดสร้างดอกคล้ายวุ้น", "Tremellales": "เบสิดิโอไมซีตที่มีทั้งระยะยีสต์และระยะเส้นใย", "Cryptococcaceae": "ยีสต์ที่มีแคปซูลพอลิแซ็กคาไรด์หนาห่อหุ้มเซลล์", "Pucciniomycetes": "ราสนิมที่เป็นปรสิตจำเพาะในพืช และมีวงชีวิตซับซ้อน", "Pucciniales": "ราสนิมที่หลายชนิดต้องอาศัยพืชสองชนิดให้ครบวงชีวิต", "Pucciniaceae": "ราสนิมที่สร้างสปอร์ได้หลายแบบในวงชีวิตเดียว", "Excavata": "โพรทิสต์เซลล์เดียวที่หลายชนิดมีร่องดูดอาหารด้านข้างเซลล์ และไมโทคอนเดรียดัดแปลงหรือลดรูป", "SAR": "ซูเปอร์กรุ๊ปที่จัดจากข้อมูลดีเอ็นเอ รวมสามกลุ่มคือ สตราเมโนไพล์ แอลวีโอเลต และไรซาเรีย", "Archaeplastida": "กลุ่มที่มีคลอโรพลาสต์จากเอนโดซิมไบโอซิสปฐมภูมิ (เยื่อหุ้มสองชั้น) รวมสาหร่ายแดง สาหร่ายเขียว และพืชบก", "Unikonta": "ซูเปอร์กรุ๊ปที่เซลล์มีแฟลเจลลัมเส้นเดียวถ้ามี รวมอะมีโบซัวกับโอพิสโทคอนต์ ซึ่งมีฟังไจและสัตว์อยู่ด้วย", "Euglenozoa": "แฟลเจลเลตที่มีแท่งโปรตีนพิเศษอยู่ในแฟลเจลลัม", "Euglenida": "ยูกลีนอยด์ที่มีแถบโปรตีน (เพลลิเคิล) ใต้เยื่อหุ้มเซลล์ บางชนิดมีคลอโรพลาสต์และจุดตา", "Kinetoplastea": "แฟลเจลเลตที่มีไคนีโทพลาสต์ คือดีเอ็นเอจำนวนมากในไมโทคอนเดรียขนาดใหญ่ หลายชนิดเป็นปรสิต", "Metamonada": "โพรทิสต์ที่อยู่ในที่ไม่มีออกซิเจน ไม่มีไมโทคอนเดรียแบบปกติ มีแต่ไมโทโซมหรือไฮโดรจีโนโซม", "Diplomonadida": "มีนิวเคลียสสองอันและแฟลเจลลัมหลายเส้น เซลล์สมมาตรซ้ายขวา", "Parabasalia": "มีไฮโดรจีโนโซมแทนไมโทคอนเดรีย และมีแฟลเจลลัมกับเยื่อลูกคลื่น ต่างจาก Diplomonadida ที่มีสองนิวเคลียส", "Alveolata": "มีถุงแบนเรียงอยู่ใต้เยื่อหุ้มเซลล์ (แอลวีโอไล) ช่วยค้ำรูปร่างเซลล์", "Ciliophora": "มีซิเลียจำนวนมาก และนิวเคลียสสองแบบ คือแมโครนิวเคลียสควบคุมการทำงาน กับไมโครนิวเคลียสใช้สืบพันธุ์", "Apicomplexa": "ปรสิตที่มีชุดโครงสร้างปลายเซลล์ (apical complex) ใช้เจาะเข้าเซลล์โฮสต์ และไม่มีอวัยวะเคลื่อนที่ในระยะส่วนใหญ่", "Dinoflagellata": "มีแฟลเจลลัมสองเส้นวางในร่องตามขวางและตามยาว จึงหมุนตัวขณะว่าย หลายชนิดทำให้น้ำทะเลเปลี่ยนสี", "Stramenopila": "เซลล์ระยะเคลื่อนที่มีแฟลเจลลัมสองเส้น และเส้นหนึ่งมีขนเล็กคล้ายหลอดเรียงอยู่", "Bacillariophyta": "ไดอะตอม ผนังเซลล์เป็นซิลิกาสองฝาประกบกันคล้ายกล่องกับฝา", "Phaeophyceae": "สาหร่ายสีน้ำตาลหลายเซลล์ที่มีฟิวโคแซนทิน และเป็นสาหร่ายที่ใหญ่ที่สุด เช่น เคลป์", "Oomycota": "ราน้ำที่หน้าตาคล้ายรา แต่ผนังเซลล์เป็นเซลลูโลสและเส้นใยมีโครโมโซมสองชุด", "Chlorophyta": "สาหร่ายสีเขียวที่มีคลอโรฟิลล์ เอ และ บี และเก็บอาหารเป็นแป้งเหมือนพืช", "Chlorophyceae": "สาหร่ายเขียวที่ส่วนใหญ่อยู่ในน้ำจืด มีทั้งเซลล์เดียว โคโลนี และเส้นสาย", "Charophyta": "สาหร่ายเขียวที่ใกล้ชิดกับพืชบกที่สุด เช่น การแบ่งไซโทพลาซึมคล้ายพืช", "Zygnematophyceae": "สาหร่ายเขียวที่ไม่มีแฟลเจลลัมเลย สืบพันธุ์แบบคอนจูเกชัน และเป็นญาติใกล้ที่สุดของพืชบก", "Rhodophyta": "สาหร่ายสีแดงที่มีไฟโคเอริทริน และไม่มีแฟลเจลลัมในทุกระยะ", "Bangiophyceae": "สาหร่ายแดงที่แต่ละเซลล์มีคลอโรพลาสต์รูปดาวอันเดียว บางชนิดเป็นแผ่นบาง เช่น โนริ", "Amoebozoa": "โพรทิสต์ที่เคลื่อนที่ด้วยเท้าเทียมรูปพู รวมทั้งอะมีบาและราเมือก", "Tubulinea": "อะมีบาที่เท้าเทียมเป็นหลอดหรือแท่ง และไหลไปในทิศเดียว", "Myxogastria": "ราเมือกพลาสโมเดียม เป็นก้อนไซโทพลาซึมก้อนเดียวที่มีนิวเคลียสจำนวนมหาศาล", "Dictyostelia": "ราเมือกเซลล์เดียว ปกติอยู่แยกเป็นอะมีบา แล้วรวมกลุ่มกันเมื่อขาดอาหาร ต่างจากราเมือกพลาสโมเดียม", "Archamoebae": "อะมีบาที่ไม่มีไมโทคอนเดรียแบบปกติ อยู่ในที่ไม่มีออกซิเจน รวมทั้งปรสิตในลำไส้", "Bryophyta": "มอส ไม่มีท่อลำเลียง ระยะแกมีโทไฟต์เด่น มีไรซอยด์หลายเซลล์และใบเล็กเรียงรอบลำต้น", "Hepatophyta": "ลิเวอร์เวิร์ต ไม่มีท่อลำเลียงและไม่มีปากใบ ไรซอยด์เป็นเซลล์เดียว และแทลลัสมักแบนแนบพื้น", "Anthocerophyta": "ฮอร์นเวิร์ต สปอโรไฟต์รูปเขาเติบโตจากฐานไปเรื่อยๆ และมีปากใบ ซึ่งลิเวอร์เวิร์ตไม่มี", "Lycophyta": "พืชมีท่อลำเลียงที่ใบเป็นไมโครฟิลล์ มีเส้นใบเส้นเดียว และสร้างสปอร์ในสตรอบิลัส", "Pterophyta": "เฟิร์นและพืชใกล้ชิด มีท่อลำเลียงแต่ไม่มีเมล็ด ใบเป็นเมกะฟิลล์ และต้องใช้น้ำช่วยในการปฏิสนธิ", "Cycadophyta": "ปรง พืชเมล็ดเปลือยที่หน้าตาคล้ายปาล์ม ต้นเพศผู้กับเพศเมียแยกกัน และสเปิร์มว่ายน้ำได้", "Ginkgophyta": "มีชนิดเดียวที่ยังเหลืออยู่ ใบรูปพัด ผลัดใบ และสเปิร์มว่ายน้ำได้", "Coniferophyta": "สน ใบรูปเข็มหรือเกล็ด สร้างเมล็ดบนเกล็ดของโคน และละอองเรณูปลิวตามลม", "Gnetophyta": "พืชเมล็ดเปลือยที่มีเวสเซลในไซเลมเหมือนพืชดอก มีเพียงสามสกุลที่หน้าตาต่างกันมาก", "Anthophyta": "พืชดอก เมล็ดอยู่ในรังไข่ซึ่งเจริญเป็นผล และมีการปฏิสนธิซ้อน", "Sphagnopsida": "มอสข้าวตอกฤๅษี ใบมีเซลล์ใสขนาดใหญ่ที่ตายแล้วไว้เก็บน้ำ", "Sphagnales": "มอสที่เก็บน้ำได้มากและทำให้น้ำรอบตัวเป็นกรด จนเกิดเป็นพรุ", "Sphagnaceae": "มอสที่กิ่งเรียงเป็นกลุ่มรอบลำต้น และอับสปอร์ดีดเปิดด้วยแรงดันอากาศ", "Marchantiopsida": "ลิเวอร์เวิร์ตแบบแทลลัสที่ผิวมีช่องอากาศ", "Marchantiales": "ลิเวอร์เวิร์ตแทลลัสที่มีโครงสร้างคล้ายร่มชูอวัยวะสืบพันธุ์", "Marchantiaceae": "ลิเวอร์เวิร์ตที่สร้างถ้วยเจมมาบนแทลลัสไว้สืบพันธุ์แบบไม่อาศัยเพศ", "Anthocerotopsida": "คลาสของฮอร์นเวิร์ต คลอโรพลาสต์ในเซลล์มีเพียงหนึ่งหรือสองอันและมีไพรีนอยด์", "Anthocerotales": "ฮอร์นเวิร์ตที่มีไซยาโนแบคทีเรียอาศัยอยู่ในช่องของแทลลัส", "Anthocerotaceae": "ฮอร์นเวิร์ตที่สปอร์มีสีเข้ม", "Lycopodiopsida": "คลาสของไลโคไฟต์ในปัจจุบัน", "Lycopodiales": "ไลโคไฟต์ที่สร้างสปอร์ขนาดเดียว (โฮโมสปอร์) ต่างจาก Selaginellales ที่สร้างสองขนาด", "Lycopodiaceae": "ไลโคไฟต์ที่ลำต้นเลื้อยหรือห้อย และสตรอบิลัสอยู่ที่ปลายกิ่ง", "Selaginellales": "ไลโคไฟต์ที่สร้างสปอร์สองขนาด และใบมีลิกูลซึ่งเป็นเกล็ดเล็กที่โคนใบ", "Selaginellaceae": "มีสกุลเดียวคือ Selaginella ใบเล็กเรียงสี่แถว", "Psilotopsida": "หวายทะนอยและพืชใกล้ชิด ไม่มีรากแท้ จัดเป็นญาติของเฟิร์นตามข้อมูลดีเอ็นเอ", "Psilotales": "พืชที่ไม่มีทั้งรากและใบแท้ ลำต้นแตกกิ่งเป็นคู่", "Psilotaceae": "มีอับสปอร์สามพูเชื่อมกันติดอยู่ตามกิ่ง", "Polypodiopsida": "คลาสของเฟิร์น รวมทั้งหญ้าถอดปล้อง เฟิร์นน้ำ และเฟิร์นทั่วไป", "Equisetales": "หญ้าถอดปล้อง ลำต้นเป็นข้อปล้องกลวง ใบลดรูปเป็นวงรอบข้อ และผิวมีซิลิกา", "Equisetaceae": "มีสกุลเดียวคือ Equisetum สร้างสปอร์ในสตรอบิลัสที่ปลายลำต้น", "Salviniales": "เฟิร์นน้ำที่สร้างสปอร์สองขนาดในสปอโรคาร์ป ต่างจากเฟิร์นบกส่วนใหญ่ที่สร้างขนาดเดียว", "Salviniaceae": "เฟิร์นลอยน้ำขนาดเล็กที่ใบมีขนกันน้ำ", "Polypodiales": "อันดับใหญ่ที่สุดของเฟิร์น อับสปอร์รวมเป็นกลุ่ม (ซอรัส) ใต้ใบ", "Athyriaceae": "เฟิร์นดินที่ซอรัสมักยาวเรียงตามเส้นใบ", "Cycadopsida": "คลาสของปรง", "Cycadales": "ปรงที่มีรากปะการังซึ่งมีไซยาโนแบคทีเรียอาศัยอยู่", "Cycadaceae": "ปรงที่ต้นเพศเมียสร้างเมล็ดบนใบสร้างเมล็ดที่เรียงหลวมๆ ไม่รวมเป็นโคนแน่น", "Ginkgoopsida": "คลาสของแปะก๊วย", "Ginkgoales": "อันดับของแปะก๊วย เหลืออยู่ชนิดเดียว", "Ginkgoaceae": "ใบรูปพัดเส้นใบแยกเป็นสองแฉกซ้ำๆ และเปลือกเมล็ดชั้นนอกมีกลิ่นเหม็น", "Pinopsida": "คลาสของสน ใบเข็มหรือเกล็ด และเมล็ดอยู่บนเกล็ดของโคน", "Pinales": "สนส่วนใหญ่ เช่น สนเขา สนฉัตร และสนแผง", "Pinaceae": "สนที่ใบเป็นเข็มออกเป็นกลุ่ม โคนเพศเมียแข็งเป็นเนื้อไม้ และเมล็ดมีปีก", "Gnetopsida": "คลาสของนีโทไฟต์", "Gnetales": "ไม้เลื้อยหรือต้นไม้ในป่าเขตร้อน ใบกว้างเส้นใบร่างแห คล้ายพืชดอก", "Gnetaceae": "มีสกุลเดียวคือ Gnetum เมล็ดมีเปลือกเนื้อนุ่มสีส้มแดง", "Welwitschiales": "มีชนิดเดียวในทะเลทราย ใบสองใบงอกจากฐานตลอดชีวิต ต่างจาก Gnetales ที่เป็นไม้เลื้อยในป่าชื้น", "Welwitschiaceae": "วงศ์ที่มีชนิดเดียวคือเวลวิตเชีย", "Liliopsida": "พืชใบเลี้ยงเดี่ยว ใบเลี้ยงหนึ่งใบ เส้นใบขนาน มัดท่อลำเลียงกระจาย ส่วนของดอกเป็นชุดละ 3 และรากฝอย", "Magnoliopsida": "พืชใบเลี้ยงคู่ ใบเลี้ยงสองใบ เส้นใบร่างแห มัดท่อลำเลียงเรียงเป็นวง ส่วนของดอกเป็นชุดละ 4 หรือ 5 และมีรากแก้ว", "Poales": "หญ้าและพืชใกล้ชิด ดอกเล็ก ลดรูป และผสมเกสรด้วยลม", "Poaceae": "หญ้า ลำต้นกลวงมีข้อ ดอกอยู่ในช่อย่อย ผลเป็นผลธัญพืชที่เปลือกเมล็ดติดกับผนังผล", "Proteales": "อันดับที่จัดจากข้อมูลดีเอ็นเอ รวมบัวหลวงกับพืชบกบางชนิดที่หน้าตาต่างกันมาก", "Nelumbonaceae": "บัวหลวง ใบกลมชูพ้นน้ำ ฐานรองดอกพองเป็นฝักบัวที่มีผลฝังอยู่ ต่างจากบัวสายซึ่งอยู่อีกวงศ์", "Malvales": "อันดับของชบา ฝ้าย และทุเรียน หลายชนิดมีเมือกในเนื้อเยื่อ", "Malvaceae": "เกสรเพศผู้มักเชื่อมกันเป็นหลอด และมีขนรูปดาวตามลำต้นและใบ", "Malpighiales": "อันดับใหญ่ของพืชดอกที่หน้าตาหลากหลายมาก จัดรวมกันตามข้อมูลดีเอ็นเอ", "Euphorbiaceae": "ยางพาราและมันสำปะหลัง หลายชนิดมีน้ำยางขาว และผลมักแตกเป็นสามพู", "Rafflesiaceae": "พืชเบียนที่ไม่มีใบ ลำต้น และรากที่มองเห็น มีแต่ดอกขนาดใหญ่โผล่ออกจากเถาของโฮสต์", "Fabales": "อันดับของพืชตระกูลถั่วและพืชใกล้ชิด", "Fabaceae": "พืชตระกูลถั่ว ผลเป็นฝัก และหลายชนิดมีปมรากที่ไรโซเบียมตรึงไนโตรเจน", "Brassicales": "พืชที่สร้างสารกลูโคซิโนเลต ซึ่งให้รสเผ็ดฉุนเมื่อเนื้อเยื่อถูกทำลาย", "Brassicaceae": "วงศ์ผักกาด ดอกมีกลีบสี่กลีบเรียงเป็นรูปกากบาท", "Porifera": "ไม่มีเนื้อเยื่อแท้ ลำตัวมีรูพรุน และใช้เซลล์ปลอกคอกรองอาหาร", "Cnidaria": "สมมาตรรัศมี เนื้อเยื่อสองชั้น ช่องทางเดินอาหารมีช่องเปิดเดียว และมีเซลล์เข็มพิษ", "Platyhelminthes": "หนอนตัวแบน สมมาตรด้านข้าง เนื้อเยื่อสามชั้น ไม่มีช่องตัว และทางเดินอาหารมีช่องเปิดเดียวหรือไม่มีเลย", "Nematoda": "หนอนตัวกลมไม่มีปล้อง มีช่องตัวเทียม ทางเดินอาหารสมบูรณ์ และลอกคราบผิวคิวทิเคิล", "Annelida": "หนอนปล้อง ลำตัวแบ่งเป็นปล้องซ้ำกัน มีช่องตัวแท้ และระบบหมุนเวียนเลือดแบบปิด", "Mollusca": "ลำตัวนิ่ม มีแมนเทิลซึ่งมักสร้างเปลือก มีกล้ามเนื้อเท้า และหลายชนิดมีแรดูลาขูดอาหาร", "Arthropoda": "มีโครงร่างภายนอกเป็นไคทิน รยางค์เป็นข้อ ลำตัวเป็นปล้อง และต้องลอกคราบเพื่อเติบโต", "Echinodermata": "ตัวเต็มวัยสมมาตรรัศมีห้าแฉก มีระบบท่อน้ำและทิวบ์ฟีต และเป็นดิวเทอโรสโตมเหมือนคอร์เดต", "Chordata": "อย่างน้อยระยะหนึ่งของชีวิตมีโนโทคอร์ด เส้นประสาทกลวงด้านหลัง ช่องเหงือก และหางที่ยื่นเลยทวารหนัก", "Demospongiae": "ฟองน้ำที่โครงค้ำเป็นเส้นใยโปรตีนสปองจินกับแท่งซิลิกา เป็นคลาสที่ใหญ่ที่สุดของฟองน้ำ", "Spongillida": "ฟองน้ำน้ำจืด", "Spongillidae": "ฟองน้ำน้ำจืดที่สร้างเจมมิวล์ไว้รอดช่วงแล้งหรือหนาว", "Scyphozoa": "แมงกะพรุนแท้ ระยะเมดูซาเด่นและใหญ่ ส่วนระยะโพลิปเล็ก", "Semaeostomeae": "แมงกะพรุนที่แขนรอบปากยาวเป็นแผ่น และมีหนวดที่ขอบร่ม", "Ulmaridae": "แมงกะพรุนร่มกว้างที่มีช่องทางเดินอาหารแตกแขนงในร่ม", "Hydrozoa": "ไนดาเรียที่ระยะโพลิปมักเด่น หลายชนิดอยู่เป็นโคโลนี ต่างจาก Scyphozoa ที่ระยะเมดูซาเด่น", "Anthoathecata": "ไฮดรอยด์ที่โพลิปไม่มีเปลือกหุ้ม", "Hydridae": "ไฮดราน้ำจืดที่อยู่ตัวเดียว และไม่มีระยะเมดูซา", "Turbellaria": "หนอนตัวแบนที่ใช้ชีวิตอิสระ ผิวมีซิเลียช่วยเคลื่อนที่ (ชื่อตามหนังสือเรียน ระบบปัจจุบันไม่ใช้เป็นคลาส)", "Tricladida": "พลานาเรียที่ลำไส้แตกเป็นสามแขนง", "Dugesiidae": "พลานาเรียน้ำจืดที่หัวเป็นรูปสามเหลี่ยมและมีจุดตาสองจุด", "Trematoda": "พยาธิใบไม้ ปรสิตที่มีปุ่มดูด และวงชีวิตต้องผ่านหอยเป็นโฮสต์กึ่งกลาง", "Opisthorchiida": "พยาธิใบไม้ที่ติดต่อจากการกินปลาดิบ", "Opisthorchiidae": "พยาธิใบไม้ที่อาศัยในท่อน้ำดีของคนและสัตว์กินปลา", "Cestoda": "พยาธิตัวตืด ไม่มีทางเดินอาหาร ดูดซึมอาหารผ่านผิว ลำตัวเป็นปล้องแบนต่อกันยาว ต่างจากพยาธิใบไม้ที่มีทางเดินอาหาร", "Cyclophyllidea": "ตืดที่หัวมีปุ่มดูดสี่ปุ่ม", "Taeniidae": "ตืดที่ระยะตัวอ่อนเป็นถุงซีสต์ในกล้ามเนื้อหรืออวัยวะของโฮสต์กึ่งกลาง", "Chromadorea": "คลาสใหญ่ของหนอนตัวกลม รวมทั้งชนิดอิสระและปรสิตหลายชนิด", "Rhabditida": "อันดับใหญ่ของหนอนตัวกลม รวมทั้ง C. elegans และพยาธิในคนหลายชนิด", "Rhabditidae": "หนอนตัวกลมขนาดเล็กที่อยู่อิสระในดินและกินแบคทีเรีย", "Ascarididae": "พยาธิตัวกลมขนาดใหญ่ที่ปากมีริมฝีปากสามอัน และอาศัยในลำไส้", "Gnathostomatidae": "พยาธิตัวกลมที่หัวพองและมีหนามเรียงเป็นวง", "Clitellata": "หนอนปล้องที่มีไคลเทลลัมไว้สร้างถุงไข่ และมีเดือยน้อยหรือไม่มีเลย เช่น ไส้เดือนดินและปลิง", "Arhynchobdellida": "ปลิงที่ไม่มีงวง ใช้ขากรรไกรหรือกล้ามเนื้อคอหอยกินอาหาร", "Hirudinidae": "ปลิงดูดเลือดที่มีขากรรไกรสามอัน", "Polychaeta": "หนอนปล้องทะเลที่แต่ละปล้องมีพาราโพเดียและเดือยจำนวนมาก ต่างจาก Clitellata ที่มีเดือยน้อย", "Phyllodocida": "หนอนทะเลที่ส่วนใหญ่ล่าเหยื่อ มีขากรรไกรที่ยื่นออกได้", "Nereididae": "หนอนทะเลที่มีหนวดและตาที่หัว และขากรรไกรคู่หนึ่ง", "Gastropoda": "หอยฝาเดียวและทาก ลำตัวบิด (ทอร์ชัน) ระหว่างการเจริญ ทำให้ช่องแมนเทิลมาอยู่ด้านหน้า", "Architaenioglossa": "หอยฝาเดียวน้ำจืดที่มีฝาปิดเปลือก (โอเพอร์คิวลัม)", "Ampullariidae": "หอยโข่งน้ำจืดที่มีทั้งเหงือกและปอด จึงหายใจในอากาศได้", "Bivalvia": "หอยสองฝา ไม่มีหัวและแรดูลา และกรองอาหารด้วยเหงือก", "Cardiida": "หอยสองฝาที่เปลือกมักมีสันหรือร่องเป็นรัศมี", "Cardiidae": "หอยคอกเคิลและหอยมือเสือ เปลือกมักมีสันเป็นรัศมี", "Cephalopoda": "หมึก มีหนวดรอบปาก ระบบประสาทซับซ้อน และระบบหมุนเวียนเลือดแบบปิด", "Nautilida": "หมึกที่ยังมีเปลือกนอกแบ่งเป็นห้อง ต่างจากหมึกทั่วไปที่เปลือกลดรูปหรือหายไป", "Nautilidae": "หอยงวงช้าง หนวดจำนวนมากที่ไม่มีปุ่มดูด", "Insecta": "แมลง ลำตัวสามส่วน ขาสามคู่ หนวดหนึ่งคู่ และส่วนใหญ่มีปีก", "Diptera": "แมลงที่มีปีกคู่เดียว ปีกคู่หลังลดรูปเป็นแท่งทรงตัว (ฮอลเทียร์)", "Culicidae": "ยุง ปากเป็นงวงเจาะดูด ปีกมีเกล็ด และตัวอ่อนอยู่ในน้ำ", "Drosophilidae": "แมลงวันผลไม้ขนาดเล็ก ตัวอ่อนกินยีสต์บนผลไม้หมัก", "Blattodea": "แมลงสาบและปลวก ปีกคู่หน้าเหนียวคล้ายหนัง ปากแบบกัดกิน และเจริญเติบโตแบบไม่สมบูรณ์", "Blattidae": "แมลงสาบขนาดใหญ่ที่อาศัยใกล้คน", "Lepidoptera": "ผีเสื้อ ปีกปกคลุมด้วยเกล็ด ตัวเต็มวัยมีงวงดูดม้วนได้ และเจริญเติบโตแบบสมบูรณ์", "Bombycidae": "ผีเสื้อกลางคืนที่หนอนพ่นใยทำรังไหม", "Malacostraca": "ครัสเตเชียนขนาดใหญ่ เช่น กุ้งและปู ลำตัวแบ่งเป็นหัวอกกับท้อง และมีหนวดสองคู่", "Decapoda": "ครัสเตเชียนที่มีขาเดินห้าคู่ และเปลือกแข็งหุ้มส่วนหัวอก (คาราพาซ)", "Penaeidae": "กุ้งทะเลที่ปล่อยไข่ลงน้ำโดยไม่อุ้มไข่ไว้ ต่างจากกุ้งก้ามกรามที่อุ้มไข่", "Arachnida": "แมง ลำตัวสองส่วน ขาเดินสี่คู่ ไม่มีหนวด และมีรยางค์คู่หน้าที่เรียกว่าคีลิเซอรา ต่างจากแมลงที่มีขาสามคู่", "Scorpiones": "แมงป่อง มีก้ามใหญ่และหางเป็นปล้องที่ปลายมีเหล็กไน", "Scorpionidae": "แมงป่องตัวใหญ่ก้ามหนา เช่น แมงป่องช้าง", "Asteroidea": "ดาวทะเล แขนแผ่ออกจากจานกลางและเชื่อมกันที่ฐาน มีทิวบ์ฟีตในร่องใต้แขน", "Valvatida": "ดาวทะเลที่ขอบแขนมีแผ่นใหญ่เรียงเป็นแถว", "Acanthasteridae": "ดาวทะเลแขนจำนวนมากและมีหนามพิษ", "Echinoidea": "เม่นทะเลและเหรียญทะเล ไม่มีแขน มีเปลือกแข็งเป็นแผ่นต่อกันและหนาม ต่างจากดาวทะเลที่มีแขน", "Diadematoida": "เม่นทะเลหนามยาว", "Diadematidae": "เม่นทะเลที่หนามยาว กลวง และเปราะ", "Leptocardii": "แอมฟิออกซัส คอร์เดตไม่มีกะโหลกที่มีโนโทคอร์ดตลอดชีวิตและยาวไปถึงปลายหัว", "Amphioxiformes": "อันดับเดียวของแอมฟิออกซัส", "Branchiostomatidae": "แอมฟิออกซัสที่มีอวัยวะสืบพันธุ์ทั้งสองข้างของลำตัว", "Ascidiacea": "เพรียงหัวหอม ตัวเต็มวัยเกาะอยู่กับที่และหุ้มด้วยทูนิกที่มีเซลลูโลส ลักษณะคอร์เดตเห็นชัดเฉพาะในตัวอ่อน", "Phlebobranchia": "เพรียงหัวหอมตัวเดี่ยวที่เหงือกมีหลอดเลือดตามยาว", "Cionidae": "เพรียงหัวหอมลำตัวทรงกระบอกโปร่งใส", "Chondrichthyes": "ปลากระดูกอ่อน ไม่มีกระดูกแข็ง ผิวเป็นเกล็ดแบบฟัน และไม่มีถุงลม ต่างจากปลากระดูกแข็ง", "Orectolobiformes": "ฉลามที่ปากอยู่หน้าตา และส่วนใหญ่มีหนวดสั้นที่จมูก", "Rhincodontidae": "มีชนิดเดียวคือฉลามวาฬ ปากกว้างอยู่ที่ปลายหัว", "Actinopterygii": "ปลากระดูกแข็งที่ครีบค้ำด้วยก้านกระดูกบางๆ และมักมีถุงลม", "Anabantiformes": "ปลาที่มีอวัยวะลาบิรินท์ใต้กระพุ้งแก้มไว้หายใจจากอากาศ", "Osphronemidae": "ปลากัด ปลากระดี่ และปลาแรด ตัวผู้มักก่อหวอดไว้ดูแลไข่", "Amphibia": "สะเทินน้ำสะเทินบก ผิวเปียกไม่มีเกล็ด หายใจทางผิวได้ และไข่ไม่มีเปลือกต้องวางในที่ชื้น", "Anura": "กบและคางคก ตัวเต็มวัยไม่มีหาง และขาหลังยาวสำหรับกระโดด", "Dicroglossidae": "กบในเอเชียที่หลายชนิดอยู่ในนาและเป็นอาหาร", "Reptilia": "สัตว์เลื้อยคลาน ผิวมีเกล็ดเคราติน และวางไข่ที่มีเปลือกและถุงน้ำคร่ำ", "Testudines": "เต่า กระดองเชื่อมกับกระดูกสันหลังและซี่โครง", "Cheloniidae": "เต่าทะเลกระดองแข็ง ขาเป็นใบพาย", "Aves": "นก มีขนนก จะงอยปากไม่มีฟัน กระดูกกลวง ไข่มีเปลือกแข็ง และเลือดอุ่น", "Galliformes": "ไก่และนกใกล้ชิด หากินบนพื้น ขาแข็งแรง และบินได้ระยะสั้น", "Phasianidae": "ไก่ ไก่ฟ้า และนกยูง ตัวผู้มักมีสีสันสดและหงอนหรือเหนียง", "Mammalia": "สัตว์เลี้ยงลูกด้วยน้ำนม มีขน ต่อมน้ำนม กระดูกหูชั้นกลางสามชิ้น และเลือดอุ่น", "Proboscidea": "ช้าง มีงวงที่เกิดจากจมูกรวมกับริมฝีปากบน และงาที่เป็นฟันตัดที่งอกยาว", "Elephantidae": "วงศ์เดียวของช้างที่ยังเหลืออยู่ คือช้างเอเชียและช้างแอฟริกา", "Primates": "ลิงและคน นิ้วหัวแม่มือหยิบจับได้ ตาอยู่ด้านหน้า และสมองใหญ่", "Hominidae": "ลิงใหญ่และคน ไม่มีหาง", "Monotremata": "สัตว์เลี้ยงลูกด้วยน้ำนมที่วางไข่ และมีช่องเปิดร่วมของทางเดินอาหารกับระบบขับถ่าย (โคลเอกา)", "Ornithorhynchidae": "ตุ่นปากเป็ด ปากแบนคล้ายเป็ดที่รับสัญญาณไฟฟ้าจากเหยื่อได้"};

function route() {
  var hash = decodeURIComponent((location.hash || '').replace(/^#/, '')) || 'home';
  var html, gAttr = '', title = 'Microsearch 2.0';
  if (hash === 'home') { html = viewHome(); }
  else if (hash === 'sources') { html = viewSources(); title = T('sources') + ' | Microsearch 2.0'; }
  else if (G(hash)) { html = viewGroup(hash); gAttr = hash; title = gName(G(hash)) + ' | Microsearch 2.0'; }
  else if (byId(hash)) { var s = byId(hash); html = viewSpecies(s); gAttr = s.g; title = s.sci + ' | Microsearch 2.0'; }
  else { html = viewNotFound(); }
  return { hash: hash, html: html, g: gAttr, title: title };
}
var lastHash = null;

/* ================= search ================= */
function searchAll(q) {
  q = q.trim().toLowerCase(); if (!q) return [];
  var out = [];
  SPECIES.forEach(function (s) {
    var g = G(s.g), ph = g.phyla[s.p];
    var hay = (s.sci + ' ' + s.th + ' ' + (SP_READ[s.id] || '') + ' ' + g.th + ' ' + g.en + ' ' + ph[0] + ' ' + ph[1] + ' ' + (READ[ph[0]] || '') + ' ' + (LIN[s.id] || []).map(function (x) { return x + ' ' + (READ[x] || ''); }).join(' ') + ' ' + s.tags.join(' ')).toLowerCase();
    var i = hay.indexOf(q); if (i !== -1) out.push({ s: s, score: s.sci.toLowerCase().indexOf(q) === 0 || s.th.indexOf(q) === 0 ? 0 : 1 + i });
  });
  return out.sort(function (a, b) { return a.score - b.score; }).slice(0, 8).map(function (x) { return x.s; });
}
function wireSearch(root) {
  root.querySelectorAll('[data-search] input').forEach(function (inp) {
    if (inp._wired) return; inp._wired = true;
    var box = document.getElementById(inp.id + '-res'), active = -1, items = [];
    function draw() {
      var q = inp.value; items = searchAll(q); active = items.length ? 0 : -1;
      if (!q.trim()) { box.hidden = true; inp.setAttribute('aria-expanded', 'false'); return; }
      box.innerHTML = items.length ? items.map(function (s, i) {
        return '<a href="#' + s.id + '" role="option" id="' + inp.id + '-o' + i + '" data-g="' + s.g + '" class="' + (i === active ? 'active' : '') + '"><span class="dot" style="width:10px;height:10px"></span><span class="r-sci sci">' + s.sci + '</span>' +
          (S.lang === 'en' ? '' : '<span class="r-th">' + spRd(s) + '</span>') + '<span class="r-g">' + lvBadge(s) + ' ' + gName(G(s.g)) + '</span></a>';
      }).join('') : '<p>' + esc(T('noResult', { q: q })) + '</p>';
      box.hidden = false; inp.setAttribute('aria-expanded', 'true');
      if (active >= 0) inp.setAttribute('aria-activedescendant', inp.id + '-o0'); else inp.removeAttribute('aria-activedescendant');
    }
    function mark() {
      box.querySelectorAll('a').forEach(function (a, i) { a.classList.toggle('active', i === active); });
      if (active >= 0) inp.setAttribute('aria-activedescendant', inp.id + '-o' + active);
    }
    inp.addEventListener('input', draw);
    inp.addEventListener('focus', function () { if (inp.value.trim()) draw(); });
    inp.addEventListener('keydown', function (e) {
      if (e.key === 'ArrowDown' && items.length) { active = (active + 1) % items.length; mark(); e.preventDefault(); }
      else if (e.key === 'ArrowUp' && items.length) { active = (active - 1 + items.length) % items.length; mark(); e.preventDefault(); }
      else if (e.key === 'Enter' && active >= 0) { go(items[active]); e.preventDefault(); }
      else if (e.key === 'Escape') { inp.value = ''; box.hidden = true; inp.setAttribute('aria-expanded', 'false'); }
    });
    box.addEventListener('mousedown', function (e) { e.preventDefault(); });
    box.addEventListener('click', function (e) { var a = e.target.closest('a'); if (!a) return; e.preventDefault(); go(byId(a.getAttribute('href').slice(1))); });
    inp.addEventListener('blur', function () { setTimeout(function () { box.hidden = true; inp.setAttribute('aria-expanded', 'false'); }, 120); });
    function go(s) { inp.value = ''; box.hidden = true; inp.setAttribute('aria-expanded', 'false'); if (location.hash === '#' + s.id) render(); else location.hash = s.id; }
  });
}

document.querySelectorAll('[data-lang]').forEach(function (b) { b.addEventListener('click', function () { S.lang = b.getAttribute('data-lang'); store.set('lang', S.lang); applyChrome(); render(true); updateNav((location.hash || '#home').slice(1)); }); });
document.querySelectorAll('[data-theme-set]').forEach(function (b) { b.addEventListener('click', function () { S.theme = b.getAttribute('data-theme-set'); store.set('theme', S.theme); applyChrome(); }); });
var menuBtn = document.getElementById('menuBtn');
function openMenu() { app.classList.add('menu-open'); menuBtn.setAttribute('aria-expanded', 'true'); setTimeout(function () { document.getElementById('closeBtn').focus(); }, 30); }
function goSearch() {
  var q = document.getElementById('heroQ');
  if (q) { window.scrollTo(0, 0); q.focus(); return; }
  S.focusSearch = true; location.hash = 'home';
}
function closeMenu() { if (!app.classList.contains('menu-open')) return; app.classList.remove('menu-open'); menuBtn.setAttribute('aria-expanded', 'false'); }
menuBtn.addEventListener('click', openMenu);
document.getElementById('topSearchBtn').addEventListener('click', goSearch);
document.getElementById('closeBtn').addEventListener('click', function () { closeMenu(); menuBtn.focus(); });
document.getElementById('scrim').addEventListener('click', closeMenu);
document.getElementById('side').addEventListener('click', function (e) { if (e.target.closest('a[href^="#"]')) closeMenu(); });
document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape' && app.classList.contains('menu-open')) { closeMenu(); menuBtn.focus(); }
  var tag = (e.target.tagName || '').toLowerCase();
  if (e.key === '/' && tag !== 'input' && tag !== 'textarea' && !e.metaKey && !e.ctrlKey) {
    e.preventDefault(); closeMenu(); goSearch();
  }
});
function trailHL(e, on) {
  var a = e.target.closest && e.target.closest('[data-trail]'); if (!a) return;
  var dg = a.closest('.dg');
  a.getAttribute('data-trail').split(' ').forEach(function (k) { dg.querySelectorAll('[data-k="' + k + '"]').forEach(function (el) { el.classList.toggle('hl', on); }); });
}
view.addEventListener('mouseover', function (e) { trailHL(e, true); });
view.addEventListener('mouseout', function (e) { trailHL(e, false); });
view.addEventListener('focusin', function (e) { trailHL(e, true); });
view.addEventListener('focusout', function (e) { trailHL(e, false); });
window.addEventListener('hashchange', function () { render(false); });

applyChrome();
wireSearch(document);
render(true);
})();
</script>
</body>
</html>
